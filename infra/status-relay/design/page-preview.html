<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page preview</title>
<!--
  Loads the REAL page.html in an iframe with the WebSocket stubbed, so the
  whole page can be exercised without a relay, a producer or a database.
  The harness beside this one covers the renderer in isolation; this one
  covers the page's own wiring: the window picker, follow/pause, the domain
  tables, and that page.html and scrubber.js still agree with each other.

  Serve the parent directory and open /design/page-preview.html.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script>
  // Feed the page a synthetic producer before its own script runs.
  const SRC = "../page.html";
  const NOW = Date.now();

  // ONE SHIFT AT 2-BM, told in order.
  //
  // This fixture used to pick a random stream and a random event type off it
  // every few seconds. That produced the right SHAPES (density, causation,
  // every lane) and nonsense CONTENT: runs that completed before they
  // started, a mount dismounted that was never mounted, four permit
  // observations in a row saying nothing. Fine for exercising the renderer,
  // useless for reading, and actively misleading in a demo, because the one
  // thing the page exists to show is whether a sequence makes sense.
  //
  // So the live hour is now SCRIPTED, beat by beat, against the same session
  // the snapshot below already describes: R-4471 aligns, takes flat fields
  // and starts a tomography; the hutch drops at 26 minutes and takes the run
  // with it; R-4472 starts and holds on a cooling-water trip; R-4480 begins
  // alignment. The snapshot's own numbers (started_at, iteration_count,
  // last_status_changed_at) are what the beats are timed against, so the
  // tables and the timeline now tell the same story instead of two.
  //
  // Every property the random version was built to guarantee is preserved
  // and each is called out at its own site below: the Unfiled lane stays
  // reachable, causation still forks rather than threads, the wide fan is
  // still deterministic and still lands in the live window, events still
  // exist for instances with no snapshot row, and the density still matches
  // the measured 2-BM hour. What changed is that all of it now happens for a
  // reason a beamline scientist would recognise.

  let seed = 11;
  function rnd() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }

  // Ids and causation, not just event types. Without them `hasCausation` is
  // false for the whole document and the page renders its relations-free
  // path, so every hover, edge and highlight went unexercised here while the
  // preview looked healthy. A fixture that cannot produce the positive case
  // makes any test written against it unfalsifiable.
  let evSeq = 0;
  const uuid = (n) => "00000000-0000-4000-8000-" + String(n).padStart(12, "0");

  // Events carry the SAME instance ids the snapshot does, or every track
  // renders as an empty bar with its events piled into a catch-all lane
  // instead. A stream_id pool that matched nothing was the whole reason to
  // check this rather than assume it. Scripting the beats makes this
  // structural instead of a filter that has to be kept honest: a beat names
  // the instance it is about, so it cannot land outside that instance's bar.
  //
  // Kinship for a dataset hangs off the EVENT, so Dataset events name ds1 /
  // ds2 / ds3 from the snapshot. A random id per event would walk the
  // flat-lane path and never the bound one, and the preview would look right
  // while testing nothing.
  //
  // "r0" and "p0" have no snapshot row at all: a run that finished before the
  // window opened still has events inside it, and they must reach the
  // "elsewhere" lane rather than vanish. The prior shifts in the backlog are
  // where they come from.
  const mins = (m) => NOW - m * 60000;

  function event(stream, id, type, ms) {
    return {
      event_id: uuid(900000 + evSeq++),
      stream_type: stream,
      stream_id: id,
      event_type: type,
      occurred_at: new Date(ms).toISOString(),
      recorded_at: new Date(ms).toISOString(),
      // One per command, near enough: a correlation group is the handful of
      // events one operator action produced, not a bucket a whole day falls
      // into. Forty ids over a day put 200 events in each and made the card's
      // "correlated with" row read as noise.
      correlation_id: uuid(500000 + evSeq),
      causation_id: null,
      cause_occurred_at: null,
    };
  }

  // A reaction: a different stream, moments later, carrying the cause's
  // correlation id. Only a subscriber sets causation_id in production, which
  // is exactly this shape.
  function caused(child, cause) {
    child.causation_id = cause.event_id;
    child.cause_occurred_at = cause.occurred_at;
    child.correlation_id = cause.correlation_id;
    return child;
  }

  // The live hour, beat by beat. Each entry is [minutesAgo, stream, id,
  // event_type, tag?, causedByTag?] and reads top to bottom as the shift
  // actually ran. Timings are taken FROM the snapshot below (a run's
  // started_at, a procedure's registered_at and last_status_changed_at), so
  // the two cannot drift into telling different stories.
  const SHIFT = [
    // Beamtime opens: the user arrives, the hutch is searched, the ESAF is
    // checked, the sample goes on the stage.
    [60, "Enclosure", "enc1", "EnclosurePermitObserved"],
    [59, "Actor", "act1", "ActorRegistered", "actor"],
    [58.6, "Visit", "v1", "VisitArrived", "visit", "actor"],
    [58.2, "Visit", "v1", "VisitCheckedIn", null, "visit"],
    [58, "Visit", "v1", "VisitStarted", null, "visit"],
    [57.4, "Clearance", "cl1", "ClearanceApproved", "cleared"],
    [57.2, "Clearance", "cl1", "ClearanceActivated", null, "cleared"],
    [57, "Enclosure", "enc1", "EnclosurePermitObserved", "searched"],
    [55.8, "Subject", "s1", "SubjectRegistered", "s1reg"],
    [55.4, "Mount", "m1", "MountAssetInstalled", null, "s1reg"],
    [55, "Subject", "s1", "SubjectMounted", "mounted"],
    [53.4, "Campaign", "c1", "CampaignRegistered"],
    [53, "Campaign", "c1", "CampaignStarted"],
    [52.6, "Allocation", "a1", "AllocationActivated"],

    // R-4471 begins under the campaign, on the mounted sample.
    [52, "Run", "r1", "RunStarted", "r1start", "mounted"],
    [51.8, "Run", "r1", "RunAddedToCampaign", null, "r1start"],
    [51.4, "Run", "r1", "RunObservationLogbookOpened", null, "r1start"],

    // Alignment, then flat fields, then the tomography itself. This is the
    // ordinary 2-BM ladder and the whole reason `iteration_count` exists on
    // the procedure rows.
    [50.4, "Procedure", "p1", "ProcedureRegistered", "p1reg"],
    [50, "Procedure", "p1", "ProcedureStarted", null, "p1reg"],
    [49, "Procedure", "p1", "ProcedureIterationStarted"],
    [48.4, "Procedure", "p1", "ProcedureIterationEnded"],
    [47, "Procedure", "p1", "ProcedureIterationStarted"],
    [45.2, "Procedure", "p1", "ProcedureIterationEnded"],
    [44, "Procedure", "p1", "ProcedureCompleted", "aligned"],
    [43.4, "Procedure", "p2", "ProcedureRegistered", null, "aligned"],
    [43, "Procedure", "p2", "ProcedureStarted", "p2start"],
    [41, "Calibration", "cal1", "CalibrationRevisionAppended", "calrev"],
    [40.4, "Calibration", "cal1", "CalibrationRevisionPublished", null, "calrev"],
    [30, "Procedure", "p2", "ProcedureCompleted", "flats"],
    [29.4, "Procedure", "p3", "ProcedureRegistered", null, "flats"],
    [29, "Procedure", "p3", "ProcedureStarted"],

    // The hutch drops mid-scan. A permit loss is the one event at this
    // beamline that reliably takes a run with it, and the caution and both
    // holds hang off that single observation.
    [26, "Enclosure", "enc1", "EnclosurePermitObserved", "permitlost"],
    [25.7, "Caution", "ct1", "CautionRegistered", null, "permitlost"],
    [25.4, "Run", "r1", "RunHeld", null, "permitlost"],
    [25.1, "Procedure", "p3", "ProcedureHeld", null, "permitlost"],
    [24, "Subject", "s2", "SubjectRegistered"],
    [22, "Enclosure", "enc1", "EnclosurePermitObserved", "permitback"],
    [21.6, "Run", "r1", "RunResumed", null, "permitback"],
    [21.4, "Run", "r1", "HoldClaimReleased", null, "permitback"],
    [21.3, "Procedure", "p3", "ProcedureResumed", null, "permitback"],

    // R-4472 starts on the second sample while R-4471 keeps scanning.
    [21, "Run", "r2", "RunStarted", "r2start"],
    [20.6, "Subject", "s2", "SubjectMounted", null, "r2start"],
    [20.2, "Run", "r2", "RunAddedToCampaign", null, "r2start"],
    [19.4, "Procedure", "p4", "ProcedureRegistered"],
    [19, "Procedure", "p4", "ProcedureStarted", null, "r2start"],
    [18, "Procedure", "p4", "ProcedureIterationStarted"],

    // An operator judgement, recorded and then rated.
    [14, "Decision", "d1", "DecisionRegistered", "d1made"],
    [13.4, "Decision", "d1", "DecisionRated", null, "d1made"],

    // Cooling water starts to fall off before it trips. The degradation is
    // the WARNING and has to precede the trip, or the fan below draws an
    // effect ahead of its cause.
    [13.2, "Supply", "sup1", "SupplyDegraded"],
    // The trip itself lands at 12.9 and is the hub of the wide fan below,
    // which is where R-4472's hold comes from.

    // R-4480 begins, unbound to any campaign, which is the row that proves a
    // standalone run still renders.
    [9, "Run", "r3", "RunStarted", "r3start"],
    [8.4, "Procedure", "p5", "ProcedureRegistered"],
    [8, "Procedure", "p5", "ProcedureStarted", null, "r3start"],
    [7, "Procedure", "p5", "ProcedureIterationStarted"],
    [6.4, "Decision", "d2", "DecisionRegistered"],
    [5.2, "Procedure", "p5", "ProcedureIterationStarted"],
    [4.6, "Procedure", "p5", "ProcedureIterationEnded"],

    // The product of the shift so far, and the one capture that fell short.
    [2.6, "Dataset", "ds1", "DatasetRegistered", "ds1reg"],
    [2.2, "Acquisition", "ds1", "AcquisitionRecorded", null, "ds1reg"],
    [1.9, "Attestation", "ds1", "AttestationRecorded", null, "ds1reg"],
    [1.5, "Dataset", "ds2", "DatasetPromoted"],
    // Shipped today: a capture whose Run ended before the file stopped
    // changing, holding 1 projection of a commanded 1541. Worth having in
    // the demo precisely because it is the case the record could not state
    // at all until now. NOTE: `Shortfall` is not yet in page.html's
    // STREAM_TYPE_TO_DOMAIN, so it files under Unfiled until that lands.
    [1.2, "Shortfall", "sf1", "ShortfallRecorded"],
    [0.9, "Procedure", "p5", "ProcedureIterationStarted"],
    // Deliberately not a real aggregate: the "Unfiled" lane has to be
    // reachable on purpose, or the one row that catches an unknown stream
    // type is the one row nothing ever tests.
    [0.4, "Sprocket", "sp1", "SprocketWidened"],
  ];

  // The tomography scan itself, which is where a real 2-BM hour gets its
  // density: 41 iterations across the 29 minutes p3 has been running, minus
  // the four it sat held. Generated rather than typed out, because the count
  // has to match the snapshot's `iteration_count` and a hand-typed list
  // would drift from it on the first edit.
  function tomographyIterations() {
    const out = [];
    let n = 0;
    for (let m = 28.5; m > 0.2 && n < 41; m -= 0.62) {
      if (m < 25.4 && m > 21.3) continue; // held: the scan is not stepping
      const started = event("Procedure", "p3", "ProcedureIterationStarted", mins(m));
      out.push(started);
      // Each step ends before the next begins. The pair is what a scan
      // actually emits, and it is also most of where a busy 2-BM hour's
      // event count comes from.
      out.push(caused(event("Procedure", "p3", "ProcedureIterationEnded", mins(m - 0.28)), started));
      n++;
    }
    return out;
  }

  // A WIDE fan: one event waking a whole rank of subscribers at once, each of
  // which wakes one or two more. A reaction chain cannot reach this shape, and
  // the card's row cap of twelve stayed unreachable no matter how many hops
  // were added; a cap that can never be hit makes every assertion about how it
  // reports itself reconcile trivially.
  //
  // The hub is the cooling-water supply going unavailable, the same BLEPS
  // Flow4 shape the deployment actually saw. That is what this fan genuinely
  // looks like in production: one observation wakes the run supervisor, the
  // procedure watcher, the caution drafter and the debriefer, and several of
  // those wake something in turn.
  //
  // Fixed at 12.9 minutes rather than left to a dice roll, because whether a
  // fan lands where the chart is looking must not depend on the wall clock.
  // It sits there rather than nearer the edge because THIS fan is where
  // R-4472's hold comes from, and the snapshot puts that hold at 12 minutes:
  // a hub placed later would have the effect preceding its cause on screen.
  // Every arm has to make sense on its own, not merely be a distinct stream.
  // Earlier drafts hung `SupplyDegraded` off the trip (degradation PRECEDES
  // unavailability, so the fan drew the cause after its effect) and paired
  // `CautionRegistered` with a `CautionSuperseded` two seconds later, which
  // reads as CORA retracting a warning it has just issued. A fan is the one
  // place a reader looks to ask "what did this cause", so a nonsense arm
  // there is worse than no arm at all.
  const FAN = [
    ["Caution", "ct2", "CautionRegistered", ["Decision", "d3", "DecisionRegistered"]],
    // The operator acknowledging a caution is a Run-stream fact, which is
    // also what takes the cascade to exactly twelve: the card's row cap has
    // to be REACHED by this fixture, or every assertion about how the card
    // reports hitting it reconciles trivially.
    //
    // It lands on R-4471, the run that is actually up at this point. R-4480
    // does not start for another four minutes, and hanging it there put an
    // acknowledgement ahead of its own run's genesis: the precise shape this
    // rewrite exists to remove, so it is worth naming rather than just
    // fixing.
    ["Caution", "ct3", "CautionRegistered", ["Run", "r1", "CautionAcknowledgement"]],
    ["Procedure", "p4", "ProcedureHeld", ["Procedure", "p4", "ProcedureIterationEnded"]],
    ["Run", "r2", "RunHeld", ["Run", "r2", "DecisionDebriefRequested"]],
    ["Decision", "d4", "DecisionRegistered", ["Decision", "d4", "DecisionRated"]],
    ["Clearance", "cl1", "ClearanceReviewStepAppended", null],
    ["Attestation", "ds2", "AttestationRecorded", null],
  ];

  function supplyTripFan() {
    const out = [];
    const hubAt = mins(12.9);
    const hub = event("Supply", "sup1", "SupplyMarkedUnavailable", hubAt);
    out.push(hub);
    let t = hubAt + 900;
    FAN.forEach(([s, id, type, grand]) => {
      t += 3000 + rnd() * 4000;
      const kid = caused(event(s, id, type, t), hub);
      out.push(kid);
      // Siblings hang off the hub AND children hang off the siblings, so the
      // walk has both shapes to follow. A fixture that only forks tests depth
      // no better than one that only threads tested branching.
      if (grand) {
        t += 1500 + rnd() * 2500;
        out.push(caused(event(grand[0], grand[1], grand[2], t), kid));
      }
    });
    // The signal clears, but a person still has to accept the supply back, so
    // Recovering is where it rests. That is exactly where 2-BM's own Flow4
    // supply sat for weeks, which is the state worth showing.
    out.push(event("Supply", "sup1", "SupplyMarkedRecovering", mins(3)));
    return out;
  }

  // Prior shifts, filling the retention window behind the live hour. These
  // run on r0 / p0, which have NO snapshot row: a run that finished before
  // the window opened still has events inside it, and they must reach the
  // "elsewhere" lane rather than vanish.
  //
  // Each is a complete cycle rather than a scatter of types, so scrolling
  // back reads as previous shifts and not as noise: start, align, scan,
  // finish, register the dataset, debrief.
  const CYCLE = [
    [0, "Run", "r0", "RunStarted"],
    [0.6, "Run", "r0", "RunObservationLogbookOpened"],
    [1.5, "Procedure", "p0", "ProcedureRegistered"],
    [2, "Procedure", "p0", "ProcedureStarted"],
    [3, "Procedure", "p0", "ProcedureIterationStarted"],
    [4, "Procedure", "p0", "ProcedureIterationEnded"],
    [5, "Procedure", "p0", "ProcedureIterationStarted"],
    [6, "Procedure", "p0", "ProcedureIterationEnded"],
    [7, "Procedure", "p0", "ProcedureCompleted"],
    [9, "Calibration", "cal0", "CalibrationRevisionAppended"],
    [12, "Run", "r0", "RunAdjusted"],
    [16, "Run", "r0", "RunCompleted"],
    [17, "Dataset", "ds3", "DatasetRegistered"],
    [17.5, "Acquisition", "ds3", "AcquisitionRecorded"],
    [18, "Run", "r0", "DecisionDebriefRequested"],
    [19, "Attestation", "ds3", "AttestationRecorded"],
  ];

  function priorShift(startMinsAgo) {
    const out = [];
    let prev = null;
    CYCLE.forEach(([off, s, id, type]) => {
      const ev = event(s, id, type, mins(startMinsAgo - off));
      // A short causal thread through the cycle, so the deep backlog is not
      // uniformly root-only.
      if (prev && rnd() < 0.5) caused(ev, prev);
      out.push(ev);
      prev = ev;
    });
    return out;
  }

  // A full retention window: roughly 780 events over the day, about 150 in
  // the live hour, quieter overnight. This is the load the relay replays on
  // connect and the page then holds, so the preview has to carry it or the
  // only thing ever exercised is the fifteen minutes the page used to keep.
  //
  // The live hour is below the 228 the busiest measured 2-BM hour reached.
  // That gap is deliberate rather than unfinished: the old fixture hit 228 by
  // emitting random types at a tuned interval, and this one only emits events
  // a real session would produce, so the count is whatever the session's own
  // beats add up to. Padding it back to 228 would mean inventing traffic,
  // which is the exact thing this rewrite removed. If a check ever needs the
  // busiest hour specifically, give it a denser SCAN rather than more noise:
  // the iteration pairs are where a real hour's volume comes from.
  function backlog() {
    const events = [];

    // Behind the live hour: a cycle every ~25 minutes through shift hours,
    // every ~75 overnight. The most recent hour is the scripted shift and is
    // always busy regardless, because everything that reads this fixture
    // looks at the live window, and a fixture that goes quiet at 3am makes
    // checks pass or fail by the clock rather than by the code.
    for (let m = 24 * 60; m > 62; ) {
      const hour = new Date(mins(m)).getHours();
      const busy = hour >= 8 && hour < 22;
      events.push(...priorShift(m));
      m -= (busy ? 22 : 68) + rnd() * (busy ? 9 : 30);
    }

    SHIFT.forEach(([m, s, id, type]) => events.push(event(s, id, type, mins(m))));
    // Second pass for the causal links, so a beat can name a tag defined
    // anywhere in the script rather than only above it.
    const tagged = {};
    let i = events.length - SHIFT.length;
    SHIFT.forEach(([, , , , tag], k) => { if (tag) tagged[tag] = events[i + k]; });
    SHIFT.forEach(([, , , , , cause], k) => {
      if (cause && tagged[cause]) caused(events[i + k], tagged[cause]);
    });

    events.push(...tomographyIterations());
    events.push(...supplyTripFan());
    events.sort((a, b) => (a.occurred_at < b.occurred_at ? -1 : a.occurred_at > b.occurred_at ? 1 : 0));
    return events;
  }

  // What the page receives while you watch it. The scan is still stepping,
  // so the live tail is the tomography ticking over plus the occasional
  // observation, which is what a 2-BM feed actually looks like between
  // operator actions rather than a fresh random domain every two seconds.
  let liveIter = 0;
  function liveTick() {
    const now = Date.now();
    const started = event("Procedure", "p3", "ProcedureIterationStarted", now);
    const out = [started, caused(event("Procedure", "p3", "ProcedureIterationEnded", now + 700), started)];
    liveIter++;
    if (liveIter % 4 === 0) {
      out.push(event("Procedure", "p5", "ProcedureIterationStarted", now + 200));
    }
    if (liveIter % 9 === 0) {
      const reg = event("Dataset", "ds1", "DatasetRegistered", now + 500);
      out.push(reg);
      out.push(caused(event("Acquisition", "ds1", "AcquisitionRecorded", now + 900), reg));
      out.push(caused(event("Attestation", "ds1", "AttestationRecorded", now + 1200), reg));
    }
    return out;
  }

  // A shape the LAYOUT can be built from, not just tables: two runs under one
  // campaign and one standalone, procedures under each, and subjects the runs
  // point at. Without `campaign_id` / `subject_id` / `parent_run_id` the
  // execution zone renders as a flat list of runs and the nesting the chart
  // exists to show goes unexercised, while the preview looks healthy.
  const iso = (msAgo) => new Date(NOW - msAgo).toISOString();
  const RUNS = [
    // `plan_name` is the template layer. A run with one and a run without
    // both have to be here: absent means the plan is not in the projection,
    // which reads as unknown rather than as a run with no plan, and a fixture
    // where every run has one would never exercise that.
    { run_id: "r1", name: "R-4471", status: "Running", campaign_id: "c1", subject_id: "s1",
      plan_name: "tomography-standard", started_at: iso(52 * 60 * 1000),
      progress: { detector: { value: 812, commanded_total: 1500 } } },
    { run_id: "r2", name: "R-4472", status: "Held", campaign_id: "c1", subject_id: "s2",
      plan_name: "tomography-standard", started_at: iso(21 * 60 * 1000),
      progress: { detector: { value: 240, commanded_total: 900 }, ring_current: { value: 101 } } },
    { run_id: "r3", name: "R-4480", status: "Running", campaign_id: null, subject_id: null,
      plan_name: null, started_at: iso(9 * 60 * 1000), progress: {} },
  ];
  const PROCEDURES = [
    { procedure_id: "p1", name: "center_alignment", kind: "alignment", parent_run_id: "r1",
      status: "Completed", registered_at: iso(50 * 60 * 1000),
      last_status_changed_at: iso(44 * 60 * 1000), iteration_count: 2 },
    { procedure_id: "p2", name: "flat_field", kind: "calibration", parent_run_id: "r1",
      status: "Completed", registered_at: iso(43 * 60 * 1000),
      last_status_changed_at: iso(30 * 60 * 1000), iteration_count: 5 },
    { procedure_id: "p3", name: "tomography", kind: "acquisition", parent_run_id: "r1",
      status: "Running", registered_at: iso(29 * 60 * 1000),
      last_status_changed_at: null, iteration_count: 41 },
    { procedure_id: "p4", name: "dark_field", kind: "calibration", parent_run_id: "r2",
      status: "Held", registered_at: iso(19 * 60 * 1000),
      last_status_changed_at: iso(12 * 60 * 1000), iteration_count: 1 },
    { procedure_id: "p5", name: "center_alignment", kind: "alignment", parent_run_id: "r3",
      status: "Running", registered_at: iso(8 * 60 * 1000),
      last_status_changed_at: null, iteration_count: 3 },
  ];

  function snapshot() {
    return {
      kind: "snapshot",
      generated_at: new Date().toISOString(),
      runs: RUNS,
      procedures: PROCEDURES,
      subjects: [
        { subject_id: "s1", name: "SMP-115", status: "Mounted", created_at: iso(55 * 60 * 1000) },
        { subject_id: "s2", name: "SMP-116", status: "Received", created_at: iso(24 * 60 * 1000) },
      ],
      campaigns: [
        { campaign_id: "c1", name: "CMP-2211", intent: "Tomography", status: "Active", run_count: 2 },
      ],
      // Datasets have no row of their own, so their bindings are the case
      // that proves kinship can hang off ONE event on a shared lane. d3 is
      // written from a subject with no producing run left open, which is the
      // reason `subject_id` rides the wire beside `producing_run_id`.
      datasets: [
        { dataset_id: "ds1", name: "tomo-4471-a", status: "Registered",
          producing_run_id: "r1", subject_id: "s1" },
        { dataset_id: "ds2", name: "tomo-4472-a", status: "Promoted",
          producing_run_id: "r2", subject_id: "s2" },
        { dataset_id: "ds3", name: "tomo-old-b", status: "Registered",
          producing_run_id: null, subject_id: "s1" },
      ],
      // Two ranges, deliberately different: one open-ended and one that
      // expires later today. Both are cover IN FORCE, so both draw to the
      // right edge, and a bar that stopped mid-chart would be the bug.
      clearances: [
        { clearance_id: "cl1", template_code: "ESAF-7741", risk_band: "Yellow",
          status: "Active", valid_from: iso(20 * 60 * 60 * 1000),
          valid_until: iso(-6 * 60 * 60 * 1000), registered_at: iso(21 * 60 * 60 * 1000),
          run_binding_ids: ["r1", "r2"], procedure_binding_ids: [],
          subject_binding_ids: ["s1"] },
        // Cover that reaches NOTHING on screen. A clearance with no bindings
        // has to stay tickless, or "covered" would be what the chart says
        // about every clearance whether or not it reaches anything.
        { clearance_id: "cl2", template_code: "RAD-118", risk_band: "Green",
          status: "Active", valid_from: null, valid_until: null,
          registered_at: iso(5 * 60 * 60 * 1000),
          run_binding_ids: [], procedure_binding_ids: [], subject_binding_ids: [] },
      ],
      // The enclosure the timeline message is about. These used to disagree:
      // the chart drew a hutch ribbon while the dropped table said "no active
      // enclosures", because they come from two different messages and only
      // one of them was ever populated here.
      enclosures: [
        { enclosure_id: "enc1", name: "2-BM-B hutch", permit_status: "Permitted",
          facility_code: "aps" },
      ],
      // The fleet readiness row. Deliberately STRANDED here, matching the
      // real 2-BM deployment on the day this shipped (16 of 20 registered
      // but never promoted). A fixture with a healthy fleet would render
      // the "ready to act" row and silently exercise none of the reporting
      // that exists for the case worth catching.
      agents: {
        ready: 4,
        total: 20,
        not_ready: [
          "AuthorityRevocationHolder", "CalibrationWatcher", "CampaignWatcher",
          "CaptureBaselineReader", "CaptureProgressFeeder", "CautionDrafter",
          "CautionPromoter", "ClearanceExpirer", "ClearanceWatcher",
          "ExperimentCoordinator", "ProcedureWatcher", "RatificationEnforcer",
          "RunDebriefer", "RunInitiator", "RunSupervisor", "RunWitness",
        ],
        held: [],
        absent: [],
      },
      decisions: [
        { decision_id: "d1", choice: "continue", confidence_band: "High",
          decided_by: "00000000-0000-4000-8000-000000000042", created_at: iso(14 * 60 * 1000) },
        { decision_id: "d2", choice: "hold for review", confidence_band: "Low",
          decided_by: "00000000-0000-4000-8000-000000000043", created_at: iso(6 * 60 * 1000) },
      ],
    };
  }

  // A permit that actually changes, so the ribbon has something to be a
  // ribbon ABOUT. Unknown at the start, good, a drop, and a recovery: drawn
  // as dots this is four samples, drawn as a ribbon it is whether the hutch
  // was safe.
  function enclosureTimeline() {
    return {
      kind: "enclosure_timeline",
      enclosure_id: "enc1",
      document: {
        domain: { from: iso(60 * 60 * 1000), to: new Date(NOW).toISOString() },
        title: "2-BM-B hutch",
        subtitle: "Permitted",
        subject_lane_id: "permit",
        lanes: [
          { lane_id: "permit", label: "Permit", render: "markers", points: [
            { t: iso(60 * 60 * 1000), label: "Unknown", state: "Unknown", tone: "warn" },
            { t: iso(57 * 60 * 1000), label: "Permitted", state: "Permitted", tone: "good" },
            { t: iso(26 * 60 * 1000), label: "NotPermitted", state: "NotPermitted", tone: "warn" },
            { t: iso(22 * 60 * 1000), label: "Permitted", state: "Permitted", tone: "good" },
          ] },
          { lane_id: "lifecycle", label: "Lifecycle", render: "markers", points: [
            { t: iso(60 * 60 * 1000), label: "Active", state: "Active" },
          ] },
        ],
      },
    };
  }

  // Rewind went entirely unexercised here: the picker is filled from a
  // `run_history_index` this stub never sent, and the history itself comes
  // from a fetch the stub answered with an empty list. So the second of the
  // page's two timeline views rendered nothing in the preview, and moving its
  // control could not be checked by looking.
  function runHistoryIndex() {
    return {
      kind: "run_history_index",
      runs: [
        { run_id: "r1", name: "R-4471", status: "Running", terminal: false },
        { run_id: "r2", name: "R-4472", status: "Held", terminal: false },
        { run_id: "r0", name: "R-4390", status: "Completed", terminal: true },
      ],
    };
  }

  // A closed history, which is the shape REWIND exists for: a fold cursor
  // rather than a live edge, and observations to fold.
  function runHistory(runId) {
    const t0 = NOW - 60 * 60 * 1000;
    const at = (min) => new Date(t0 + min * 60000).toISOString();
    const events = [
      { event_type: "RunStarted", occurred_at: at(0) },
      { event_type: "RunAdjusted", occurred_at: at(11) },
      { event_type: "RunHeld", occurred_at: at(26) },
      { event_type: "RunResumed", occurred_at: at(33) },
      { event_type: "RunCompleted", occurred_at: at(52) },
    ];
    const observations = [];
    for (let i = 0; i <= 52; i += 2) {
      observations.push({
        channel_name: "detector",
        sampled_at: at(i),
        value: Math.round(i * 28.8),
        commanded_total: 1500,
      });
      observations.push({
        channel_name: "ring_current",
        sampled_at: at(i),
        value: 101 - (i % 7) * 0.4,
        commanded_total: null,
      });
    }
    return { run_id: runId, events, observations, observations_truncated: false };
  }

  class StubSocket {
    constructor() {
      this.readyState = 1;
      setTimeout(() => {
        this.onopen && this.onopen();
        this._send({ producer_connected: true });
        this._send(snapshot());
        this._send(runHistoryIndex());
        this._send(enclosureTimeline());
        this._send({ kind: "activity", events: backlog() });
        this._tick = setInterval(() => {
          this._send(snapshot());
          this._send({ kind: "activity", events: liveTick() });
        }, 2000);
      }, 80);
    }
    _send(obj) { this.onmessage && this.onmessage({ data: JSON.stringify(obj) }); }
    close() { clearInterval(this._tick); }
    send() {}
  }

  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  // `no-store`, plus a cache-buster on the script the page pulls in.
  //
  // Without both, the harness happily shows a page.html and a scrubber.js
  // from some earlier edit while the server already has the current ones.
  // That is a uniquely expensive failure HERE, because this page's whole job
  // is to show what a change looks like: the edit appears to have done
  // nothing, and the natural next move is to go and "fix" code that was
  // already right. It also makes the harness flaky in a way that looks like
  // a fixture bug, since a stale page.html against a current scrubber.js
  // fails in whatever way those two versions happen to disagree.
  fetch(SRC, { cache: "no-store" })
    .then((r) => r.text())
    .then((html) => {
      // Published on THIS window so the injected shim below can reach them
      // through `window.parent`.
      window.__coraStubSocket = StubSocket;
      window.__coraStubFetch = (url) => {
        const m = String(url).match(/^\/run-history\/(.+)$/);
        const body = m ? runHistory(decodeURIComponent(m[1])) : runHistoryIndex();
        return Promise.resolve({ ok: true, json: () => Promise.resolve(body) });
      };

      // Inject the swap INTO the document rather than assigning onto the
      // iframe's window from out here.
      //
      // Assigning from outside is a race the preview loses at random, and
      // loses invisibly: `document.open()` resets the frame's globals, so a
      // patch applied before `write` is wiped, and one applied after `close`
      // can arrive after page.html's own script has already opened a REAL
      // WebSocket. That 404s against the static server and the page renders
      // DISCONNECTED with zero events, which reads as a broken FIXTURE rather
      // than a broken harness. Diagnosing it the slow way, the frame reports
      // `WebSocket === StubSocket` while the page sits disconnected, because
      // by then the patch has landed and the damage is done.
      //
      // A script tag at the top of <head> has no such ordering question: it
      // is parsed and run before the page's own inline script at the end of
      // body, every time.
      const shim = "<scr" + "ipt>window.WebSocket=window.parent.__coraStubSocket;" +
                   "window.fetch=window.parent.__coraStubFetch;</scr" + "ipt>";
      const bust = "?preview=" + Date.now();
      const fresh = html.replace(/(<script[^>]+src=")([^"]+)(")/g, "$1$2" + bust + "$3");
      const wired = fresh.includes("<head>")
        ? fresh.replace("<head>", "<head>" + shim)
        : shim + fresh;

      const doc = frame.contentDocument;
      doc.open();
      doc.write(wired);
      doc.close();
    });
</script>
</body>
</html>
