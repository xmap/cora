<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page preview</title>
<!--
  Loads the REAL page.html in an iframe with the WebSocket stubbed, so the
  whole page can be exercised without a relay, a producer or a database.
  The harness beside this one covers the renderer in isolation; this one
  covers the page's own wiring: the window picker, follow/pause, the domain
  tables, and that page.html and scrubber.js still agree with each other.

  Serve the parent directory and open /design/page-preview.html.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script>
  // Feed the page a synthetic producer before its own script runs.
  const SRC = "../page.html";
  const NOW = Date.now();
  const LANES = [
    ["Run", ["RunStarted", "RunAdjusted", "RunAborted", "RunCompleted", "RunResumed"]],
    ["Decision", ["DecisionRegistered", "DecisionRated", "DecisionDebriefRequested"]],
    ["Procedure", ["ProcedureStarted", "ProcedureIterationStarted", "ProcedureCompleted"]],
    ["Caution", ["CautionRegistered"]],
    ["Enclosure", ["EnclosurePermitObserved"]],
    ["Dataset", ["DatasetRegistered", "DatasetPromoted"]],
    // Zones other than Execution and Judgement were exercised by a permit
    // ribbon and nothing else, so every lane the page can now file -- an
    // equipment change, a clearance review, a budget draw -- went undrawn
    // here while the fixture looked complete.
    ["Clearance", ["ClearanceReviewed", "ClearanceExtended"]],
    ["Mount", ["MountRegistered", "MountDismounted"]],
    ["Supply", ["SupplyLevelObserved"]],
    ["Visit", ["VisitStarted"]],
    ["Allocation", ["AllocationDrawnDown"]],
    ["Calibration", ["CalibrationRecorded"]],
    // Deliberately not in the page's domain table: the "Unfiled" lane has to
    // be reachable, or the one row that catches an unknown stream type is
    // the one row nothing ever tests.
    ["Sprocket", ["SprocketWidened"]],
  ];

  let seed = 11;
  function rnd() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }

  // Ids and causation, not just event types. Without them `hasCausation` is
  // false for the whole document and the page renders its relations-free
  // path, so every hover, edge and highlight went unexercised here while the
  // preview looked healthy. A fixture that cannot produce the positive case
  // makes any test written against it unfalsifiable.
  let evSeq = 0;
  const uuid = (n) => "00000000-0000-4000-8000-" + String(n).padStart(12, "0");

  // Events have to carry the SAME instance ids the snapshot does, or every
  // track renders as an empty bar with its events piled into a catch-all lane
  // instead. A stream_id pool that matched nothing was the whole reason to
  // check this rather than assume it.
  // Ids AND lifetimes. An event has to belong to an instance that was alive
  // when it happened, or marks land outside their own track's bar and the
  // preview shows a geometry the real feed can never produce -- which is
  // exactly the kind of plausible-looking fixture that has already sent this
  // work down two wrong turns.
  //
  // "r0" and "p0" have no snapshot row at all: a run that finished before the
  // window opened still has events inside it, and they must reach the
  // "elsewhere" lane rather than vanish.
  const LIVES = {
    Run: [
      ["r1", 52, 0], ["r2", 21, 0], ["r3", 9, 0], ["r0", 24 * 60, 55],
    ],
    Procedure: [
      ["p1", 50, 44], ["p2", 43, 30], ["p3", 29, 0],
      ["p4", 19, 12], ["p5", 8, 0], ["p0", 24 * 60, 58],
    ],
    Subject: [["s1", 55, 0], ["s2", 24, 0]],
    Campaign: [["c1", 52, 0]],
    Enclosure: [["enc1", 60, 0]],
    Clearance: [["cl1", 24 * 60, 0], ["cl2", 24 * 60, 0]],
  };
  function streamIdFor(stream, ms) {
    const lives = LIVES[stream];
    if (!lives) {
      // Judgement domains have no instance track, so their ids only ever have
      // to tell one stream from another.
      return uuid(100 + Math.floor(rnd() * 12));
    }
    const minsAgo = (NOW - ms) / 60000;
    const alive = lives.filter((l) => minsAgo <= l[1] && minsAgo >= l[2]);
    const pool = alive.length ? alive : lives;
    return pool[Math.floor(rnd() * pool.length)][0];
  }

  function event(stream, types, ms) {
    return {
      event_id: uuid(900000 + evSeq++),
      stream_type: stream,
      stream_id: streamIdFor(stream, ms),
      event_type: types[Math.floor(rnd() * types.length)],
      occurred_at: new Date(ms).toISOString(),
      recorded_at: new Date(ms).toISOString(),
      // One per command, near enough: a correlation group is the handful of
      // events one operator action produced, not a bucket a whole day falls
      // into. Forty ids over a day put 200 events in each and made the card's
      // "correlated with" row read as noise.
      correlation_id: uuid(500000 + evSeq),
      causation_id: null,
      cause_occurred_at: null,
    };
  }

  function burst(atMs) {
    const [stream, types] = LANES[Math.floor(rnd() * LANES.length)];
    const n = rnd() < 0.45 ? 1 + Math.floor(rnd() * 5) : 1;
    const out = [];
    for (let i = 0; i < n; i++) out.push(event(stream, types, atMs + i * 400));

    // A REACTION tail. Only a subscriber sets causation_id in production, and
    // it fires within a couple of seconds of its cause and on a different
    // stream, so the chain has to be built that way here or the fixture keeps
    // producing roots forever. An earlier version tried to chain within a
    // burst, which cannot work: a burst is one stream and the next is eight
    // seconds away, so no candidate was ever both foreign and recent.
    if (rnd() < 0.55) {
      let cause = out[Math.floor(rnd() * out.length)];
      let ms = atMs + n * 400;
      const hops = 1 + Math.floor(rnd() * 3);
      for (let h = 0; h < hops; h++) {
        const other = LANES.filter((l) => l[0] !== cause.stream_type);
        const [rStream, rTypes] = other[Math.floor(rnd() * other.length)];
        ms += 300 + rnd() * 1500;
        const re = event(rStream, rTypes, ms);
        re.causation_id = cause.event_id;
        re.cause_occurred_at = cause.occurred_at;
        re.correlation_id = cause.correlation_id;
        out.push(re);
        cause = re;
      }
    }
    return out;
  }

  // A full retention window, at the measured 2-BM shape: 228 events in the
  // busiest hour, quieter overnight. This is the load the relay now replays
  // on connect and the page then holds, so the preview has to carry it or the
  // only thing ever exercised is the fifteen minutes the page used to keep.
  function backlog() {
    const events = [];
    const span = 24 * 60 * 60 * 1000;
    for (let t = NOW - span; t < NOW; ) {
      // Hour of day drives the rate over the deep backlog: a beamline runs hot
      // in shift hours and ticks over between them. The most recent hour is
      // always busy regardless, because everything that reads this fixture --
      // the eye and every check -- looks at the live window, and a fixture
      // that goes quiet at 3am makes those checks pass or fail by the clock
      // rather than by the code.
      const hour = new Date(t).getHours();
      const recent = NOW - t < 60 * 60 * 1000;
      const busy = recent || (hour >= 8 && hour < 22);
      t += (busy ? 8000 : 40000) + rnd() * (busy ? 25000 : 90000);
      if (t < NOW) events.push(...burst(t));
    }
    return events;
  }

  // A shape the LAYOUT can be built from, not just tables: two runs under one
  // campaign and one standalone, procedures under each, and subjects the runs
  // point at. Without `campaign_id` / `subject_id` / `parent_run_id` the
  // execution zone renders as a flat list of runs and the nesting the chart
  // exists to show goes unexercised, while the preview looks healthy.
  const iso = (msAgo) => new Date(NOW - msAgo).toISOString();
  const RUNS = [
    { run_id: "r1", name: "R-4471", status: "Running", campaign_id: "c1", subject_id: "s1",
      started_at: iso(52 * 60 * 1000),
      progress: { detector: { value: 812, commanded_total: 1500 } } },
    { run_id: "r2", name: "R-4472", status: "Held", campaign_id: "c1", subject_id: "s2",
      started_at: iso(21 * 60 * 1000), progress: {} },
    { run_id: "r3", name: "R-4480", status: "Running", campaign_id: null, subject_id: null,
      started_at: iso(9 * 60 * 1000), progress: {} },
  ];
  const PROCEDURES = [
    { procedure_id: "p1", name: "center_alignment", kind: "alignment", parent_run_id: "r1",
      status: "Completed", registered_at: iso(50 * 60 * 1000),
      last_status_changed_at: iso(44 * 60 * 1000), iteration_count: 2 },
    { procedure_id: "p2", name: "flat_field", kind: "calibration", parent_run_id: "r1",
      status: "Completed", registered_at: iso(43 * 60 * 1000),
      last_status_changed_at: iso(30 * 60 * 1000), iteration_count: 5 },
    { procedure_id: "p3", name: "tomography", kind: "acquisition", parent_run_id: "r1",
      status: "Running", registered_at: iso(29 * 60 * 1000),
      last_status_changed_at: null, iteration_count: 41 },
    { procedure_id: "p4", name: "dark_field", kind: "calibration", parent_run_id: "r2",
      status: "Held", registered_at: iso(19 * 60 * 1000),
      last_status_changed_at: iso(12 * 60 * 1000), iteration_count: 1 },
    { procedure_id: "p5", name: "center_alignment", kind: "alignment", parent_run_id: "r3",
      status: "Running", registered_at: iso(8 * 60 * 1000),
      last_status_changed_at: null, iteration_count: 3 },
  ];

  function snapshot() {
    return {
      kind: "snapshot",
      generated_at: new Date().toISOString(),
      runs: RUNS,
      procedures: PROCEDURES,
      subjects: [
        { subject_id: "s1", name: "SMP-115", status: "Mounted", created_at: iso(55 * 60 * 1000) },
        { subject_id: "s2", name: "SMP-116", status: "Received", created_at: iso(24 * 60 * 1000) },
      ],
      campaigns: [
        { campaign_id: "c1", name: "CMP-2211", intent: "Tomography", status: "Active", run_count: 2 },
      ],
      datasets: [],
      // Two ranges, deliberately different: one open-ended and one that
      // expires later today. Both are cover IN FORCE, so both draw to the
      // right edge, and a bar that stopped mid-chart would be the bug.
      clearances: [
        { clearance_id: "cl1", template_code: "ESAF-7741", risk_band: "Yellow",
          status: "Active", valid_from: iso(20 * 60 * 60 * 1000),
          valid_until: iso(-6 * 60 * 60 * 1000), registered_at: iso(21 * 60 * 60 * 1000) },
        { clearance_id: "cl2", template_code: "RAD-118", risk_band: "Green",
          status: "Active", valid_from: null, valid_until: null,
          registered_at: iso(5 * 60 * 60 * 1000) },
      ],
      enclosures: [], decisions: [],
    };
  }

  // A permit that actually changes, so the ribbon has something to be a
  // ribbon ABOUT. Unknown at the start, good, a drop, and a recovery: drawn
  // as dots this is four samples, drawn as a ribbon it is whether the hutch
  // was safe.
  function enclosureTimeline() {
    return {
      kind: "enclosure_timeline",
      enclosure_id: "enc1",
      document: {
        domain: { from: iso(60 * 60 * 1000), to: new Date(NOW).toISOString() },
        title: "2-BM-B hutch",
        subtitle: "Permitted",
        subject_lane_id: "permit",
        lanes: [
          { lane_id: "permit", label: "Permit", render: "markers", points: [
            { t: iso(60 * 60 * 1000), label: "Unknown", state: "Unknown", tone: "warn" },
            { t: iso(57 * 60 * 1000), label: "Permitted", state: "Permitted", tone: "good" },
            { t: iso(26 * 60 * 1000), label: "NotPermitted", state: "NotPermitted", tone: "warn" },
            { t: iso(22 * 60 * 1000), label: "Permitted", state: "Permitted", tone: "good" },
          ] },
          { lane_id: "lifecycle", label: "Lifecycle", render: "markers", points: [
            { t: iso(60 * 60 * 1000), label: "Active", state: "Active" },
          ] },
        ],
      },
    };
  }

  class StubSocket {
    constructor() {
      this.readyState = 1;
      setTimeout(() => {
        this.onopen && this.onopen();
        this._send({ producer_connected: true });
        this._send(snapshot());
        this._send(enclosureTimeline());
        this._send({ kind: "activity", events: backlog() });
        this._tick = setInterval(() => {
          this._send(snapshot());
          if (rnd() < 0.7) this._send({ kind: "activity", events: burst(Date.now()) });
        }, 2000);
      }, 80);
    }
    _send(obj) { this.onmessage && this.onmessage({ data: JSON.stringify(obj) }); }
    close() { clearInterval(this._tick); }
    send() {}
  }

  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  fetch(SRC)
    .then((r) => r.text())
    .then((html) => {
      const doc = frame.contentDocument;
      doc.open();
      doc.write(html);
      doc.close();
      // Replace before page.html's own connect() runs on DOMContentLoaded-ish
      // timing; its script is inline at the end of body, so patching the
      // iframe's global here beats it to the first connect attempt.
      frame.contentWindow.WebSocket = StubSocket;
      frame.contentWindow.fetch = () =>
        Promise.resolve({ ok: true, json: () => Promise.resolve({ runs: [] }) });
    });
</script>
</body>
</html>
