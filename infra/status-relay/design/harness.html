<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scrubber harness</title>
<!--
  Renderer harness for scrubber.js. Loads the REAL module and the REAL page
  stylesheet, then feeds it synthetic timeline documents at densities the live
  2-BM feed only reaches occasionally, so the collapse and label-seating passes
  can be exercised without waiting for the beamline to be busy.

  There is no build step, no bundler and no JS test runner for this directory,
  so this harness is the only way these passes get exercised at all. It is a
  dev fixture, not a test: it reports numbers, it does not assert. The readout
  line is what you check, and `overlapping 0` is the one that matters.

  Serve the directory rather than opening the file directly, since it fetches
  ../page.html for the stylesheet:
      python3 -m http.server 8799 --directory infra/status-relay
  then open http://127.0.0.1:8799/design/harness.html

  Density figures come from the measured record (2026-08-28): 13,822 events
  ever, 25 stream types, 228 in the busiest hour, Run and Decision 91% of all
  of them. Traffic is sparse with BURSTS, which is why the interesting cases
  here are clustered rather than uniformly dense.
-->
<style id="page-css"></style>
<style>
  body {
    margin: 0; padding: 1.6rem; background: #0e1117; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 0.95rem; color: #8a8f98; font-weight: 600; margin: 0 0 1rem; }
  .bar { display: flex; gap: 1.4rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .grp { display: flex; flex-direction: column; gap: 5px; }
  .grp > span {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: #768091;
  }
  .seg { display: flex; border: 1px solid #2a323f; border-radius: 5px; overflow: hidden; }
  .seg button {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 6px 12px;
    border: 0; border-right: 1px solid #2a323f; background: transparent;
    color: #aab4c2; cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: #e6b24a; color: #1a130a; font-weight: 600; }
  #readout {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #768091;
    margin-bottom: 1rem; line-height: 1.7;
  }
  #readout b { color: #e7ecf2; font-weight: 600; }
</style>
</head>
<body>
  <h1>scrubber.js renderer harness</h1>
  <div class="bar">
    <div class="grp"><span>Window</span><div class="seg" id="seg-window"></div></div>
    <div class="grp"><span>Traffic</span><div class="seg" id="seg-traffic"></div></div>
    <div class="grp"><span>Shape</span><div class="seg" id="seg-shape"></div></div>
  </div>
  <div id="readout"></div>
  <div id="stage"></div>

<script src="../scrubber.js"></script>
<script src="./fixtures.js"></script>
<script>
(function () {
  "use strict";

  // Reuse the real page's stylesheet rather than a copy, so a class renamed in
  // page.html shows up here as an unstyled element instead of silently passing.
  fetch("../page.html")
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var m = html.match(/<style>([\s\S]*?)<\/style>/);
      if (m) document.getElementById("page-css").textContent = m[1];
      draw();
    })
    .catch(draw);

  var WINDOWS = [["2 min", 120], ["5 min", 300], ["15 min", 900], ["60 min", 3600]];
  var TRAFFIC = [["Quiet", 40], ["Typical", 110], ["Peak", 228]];
  var SHAPES = [["Bursty", "bursty"], ["Uniform", "uniform"], ["One instant", "pileup"],
                ["Single event", "single"], ["Empty", "empty"]];
  var state = { win: 900, per: 228, shape: "bursty" };

  function seg(id, opts, get, set) {
    var host = document.getElementById(id);
    host.innerHTML = "";
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = o[0];
      b.setAttribute("aria-pressed", String(get() === o[1]));
      b.addEventListener("click", function () { set(o[1]); draw(); });
      host.appendChild(b);
    });
  }

  function draw() {
    seg("seg-window", WINDOWS, function () { return state.win; }, function (v) { state.win = v; });
    seg("seg-traffic", TRAFFIC, function () { return state.per; }, function (v) { state.per = v; });
    seg("seg-shape", SHAPES, function () { return state.shape; }, function (v) { state.shape = v; });

    var doc = window.ScrubberFixtures.activityDocument(state.win, state.per, state.shape, 7);
    window.CoraScrubber.mount(document.getElementById("stage"), doc, {
      chromeTitle: "Live activity",
      sliderLabel: "Fold cursor: time within the window",
      follow: true,
      showPlay: false,
      showJumpLast: false,
    });

    var stats = window.ScrubberFixtures.measure(document.getElementById("stage"), doc);
    var plot = 920 - 84 - 24;
    document.getElementById("readout").innerHTML =
      "<b>" + stats.events + "</b> events &middot; <b>" +
      (state.win / plot).toFixed(2) + "s</b> per unit &middot; marks <b>" + stats.marks +
      "</b> (<b>" + stats.clusters + "</b> collapsed) &middot; labels <b>" + stats.labels +
      "</b>, overlapping <b>" + stats.overlaps + "</b> &middot; tier-2 events <b>" +
      stats.tier2 + "</b>, of those labelled <b>" + stats.tier2Labelled + "</b>";
  }
})();
</script>
</body>
</html>
