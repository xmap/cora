# pgBackRest configuration for CORA's Postgres event store.
#
# Default location is /etc/pgbackrest/pgbackrest.conf. The drill stack
# mounts this file there read-only; a VM or workstation deployment copies
# it there and edits the two site-specific values called out below.
#
# ## The one line that changes per deployment
#
# repo1-type selects where backups land. It is `posix` here (a local
# directory), and posix is the only target that needs no credentials, so
# it is the right starting point and the wrong ending point: a backup on
# the same host as the database does not survive losing the host. When
# the APS 2-BM backup target is decided, change repo1-type and add its
# settings. No operator-facing command changes, because pgBackRest
# addresses the repository through the same `--stanza` regardless of what
# backs it.
#
#   repo1-type=posix   repo1-path=/var/lib/pgbackrest
#   repo1-type=cifs    repo1-path=/mnt/facility-share/cora   (an NFS or SMB mount)
#   repo1-type=sftp    repo1-host=... repo1-sftp-private-key-file=...
#   repo1-type=s3      repo1-s3-bucket=... repo1-s3-key=... repo1-s3-endpoint=...
#
# The s3 and sftp targets introduce a credential, which lands in the
# secrets-management concern that docs/stack/deferred.md still gates on
# the same trigger. A cifs or NFS mount does not: the filesystem is
# already mounted and pgBackRest holds no secret of its own. Deciding the
# target and deciding secrets are one conversation for two of the four
# options.
#
# ## The part of this that is NOT deferrable
#
# Repository ENCRYPTION is fixed when the stanza is created and cannot be
# changed afterwards. Adding repo1-cipher-type later means deleting the
# stanza and losing every backup taken before that point. So moving to a
# shared mount or an object store, which is exactly when facility data
# leaving the host starts to matter, has a decision attached to it that
# has to be made BEFORE the first backup at the new target, not after:
#
#   repo1-cipher-type=aes-256-cbc
#   repo1-cipher-pass=<passphrase, from the secret store>
#
# Left off here deliberately: a posix repository on the database's own
# host is inside the same trust boundary as PGDATA, and a passphrase with
# nowhere to live is a passphrase next to the backup. Revisit it in the
# same change that moves repo1-type, and treat losing the passphrase as
# equivalent to losing the backups.

[global]
repo1-path=/var/lib/pgbackrest
repo1-type=posix

# Four full backups retained. At the weekly full / daily differential
# cadence SUGGESTED in docs/stack/deployment.md (nothing schedules it yet)
# that is roughly a month of history, chosen to outlive a beamtime run
# cycle: the failure this guards against is noticing a corruption weeks
# later, after the experiment that produced the events has ended.
# Differentials are not separately capped, so each full backup keeps its
# own until it expires.
#
# repo1-retention-archive is deliberately UNSET. WAL needed to make any
# retained backup consistent is kept regardless, and with
# repo1-retention-full-type=count the archive retention defaults to
# repo1-retention-full, so continuous WAL is held across all four fulls.
# That default is CONDITIONAL on the count type: switching this to `time`
# changes the archive behaviour too, so repo1-retention-archive has to be
# reconsidered in the same edit.
#
# Retention is applied when a backup finishes, not by a daemon. Until
# something schedules backups, nothing expires either, and the repository
# grows without bound. See the limits in docs/stack/deployment.md.
repo1-retention-full=4
repo1-retention-full-type=count

# zstd over the default gzip. The event store is jsonb payloads, which
# compress well, and zstd reaches a similar ratio at a fraction of the
# CPU. That matters here because the backup runs on the same host as the
# beamline's system of record, where a backup that saturates a core is a
# backup an operator learns to switch off.
compress-type=zst
compress-level=3

# Fail the backup if a WAL segment it depends on never reached the
# repository. This is on by default and is called out because turning it
# off is how a backup set becomes unrestorable while every command still
# reports success.
archive-check=y

# Combine small files into bundles, which cuts the file count in the
# repository sharply for a schema with many small relations. Note the
# trade-off on a posix repository: one damaged bundle affects every file
# in it, so bundling helps throughput and hurts blast radius. pgBackRest
# checksums every file regardless of this setting, and `pgbackrest
# --stanza=cora verify` is what reads those checksums back. Nothing in
# this repository runs `verify` on a schedule yet.
repo1-bundle=y

# Force an immediate checkpoint so the backup starts now rather than
# waiting for the next scheduled one. The cost is an I/O spike at backup
# time, which is in tension with the compression choice above; it is
# accepted because a backup that waits is a backup whose start time an
# operator cannot predict. Requires pg_checkpoint membership (or
# superuser) for the backup role.
start-fast=y

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# ## What is NOT in this file, and must be set on the CLUSTER
#
# archive_mode, archive_command and archive_timeout are PostgreSQL
# settings, not pgBackRest ones, so copying this file to a host is only
# half of an installation. Without them there is no WAL archive and the
# best any restore can do is return to the moment a backup ran. The drill
# stack sets them in docker-compose.backup.yml; a package-managed
# Postgres sets them in postgresql.conf or a conf.d fragment:
#
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=cora archive-push %p'
#   archive_timeout = 60
#
# Prefer a config file over passing them on the postgres command line.
# Command-line settings outrank both postgresql.conf and ALTER SYSTEM, so
# a cluster started with -c cannot be changed without a restart, and
# pgBackRest's own `--archive-mode=off` restore option (which works by
# writing to postgresql.auto.conf) silently does nothing.

[cora]
# PGDATA for the pgvector/pgvector:pg18 image. The official Postgres
# images place the cluster under /var/lib/postgresql/<major>/docker
# rather than /var/lib/postgresql/data; infra/docker-compose.yml carries
# the same note against its volume mount. A package-managed Postgres on a
# VM uses /var/lib/postgresql/18/main instead, and this is the line to
# change.
pg1-path=/var/lib/postgresql/18/docker

# pg1-database defaults to `postgres` and pg1-user to the local OS user.
# CORA's cluster has neither of those: POSTGRES_USER is `cora`, so no
# `postgres` role exists and no `postgres` database is created. Leaving
# the defaults produces `role "postgres" does not exist` at
# stanza-create, which reads like a broken installation rather than a
# two-line configuration gap.
#
# This must NOT be the `cora_app` role the application connects as.
# Backup calls pg_backup_start / pg_backup_stop, and start-fast above
# forces a checkpoint; cora_app is granted none of that, deliberately.
# Backup credentials and application credentials are separate on purpose.
#
# A superuser satisfies this and is what the container gives us, since
# POSTGRES_USER creates one. The least-privilege alternative on a
# package-managed host is a role with pg_read_all_settings and
# pg_checkpoint membership plus EXECUTE on pg_backup_start,
# pg_backup_stop, pg_switch_wal and pg_create_restore_point. Worth
# preferring there, because on that path `cora` is often merely the
# database OWNER (see the migration that creates cora_app) and owner is
# not superuser.
#
# One more host difference: this works over the local socket here only
# because the official Postgres image writes `local all all trust` into
# pg_hba.conf. A package-managed Postgres ships `local all all peer`,
# where OS user postgres connecting as role cora is refused. That path
# needs a pg_hba or pg_ident entry, or a .pgpass.
pg1-user=cora
pg1-database=cora
