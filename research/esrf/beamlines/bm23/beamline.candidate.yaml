  facility_code: esrf
  confirm: optics hutch (oh); inferred from config layout (ENC-1, PSS-1)
- name: bm23-eh
  facility_code: esrf
  confirm: experiment hutch (eh; EXAFS/XANES + XES); inferred from config layout (ENC-1)
