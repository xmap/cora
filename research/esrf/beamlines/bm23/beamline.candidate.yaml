# CANDIDATE beamline descriptor: hand-read from gitlab.esrf.fr/bm23/beamline_configuration
# (commit 8bf008c), NOT authoritative. Every device carries new: true and a confirm note.
# WARNING: this config is STALE (last commit 2022-07-07); handles are a 2022 snapshot, very
# likely changed on the live beamline (STALE-1). The config also carries cross-beamline
# leftovers (BM05/BM29/ID10/ID24 monos + sessions, id19bcdu8) that are NOT BM23 devices and are
# excluded (XBL-1). Grouping by stage and enclosure names are inferred from the config layout
# (oh / eh); Family suggestions and hutch boundaries need human curation, and any new Family
# needs the naming-r3 gate. Do not copy into deployments/ without review. BM23 is a
# bending-magnet XAS beamline (EXAFS/XANES + XES); NOT yet a deployment.

beamline:
