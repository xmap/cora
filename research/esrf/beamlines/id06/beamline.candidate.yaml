# CANDIDATE beamline descriptor: hand-read from gitlab.esrf.fr/ID06/beamline_configuration
# (commit 19bad8a), NOT authoritative. Every device carries new: true and a confirm note.
# Grouping by stage and the enclosure names are inferred from the config directory layout
# (oh / eh1 / eh2); Family suggestions and hutch boundaries need human curation, and any new
# Family needs the naming-r3 gate. Do not copy into deployments/ without review. ID06 is NOT
# yet a deployment: this is net-new. The headline large-volume-press technique has NO press
# device in the public config (only generic stages + a view camera), recorded as PRESS-1 in
# facts.md, not invented here.

