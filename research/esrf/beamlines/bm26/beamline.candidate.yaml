    new: true
    confirm: 'SAXS/XAFS sample positioning (samplex/sampley, sx/sy/sz, gonio, xcradle/ycradle on IcePAP); family LinearStage (catalog); per-host map confirm (SAMPLE-1)'
  - name: Beamstop
