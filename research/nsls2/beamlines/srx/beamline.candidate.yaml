# CANDIDATE beamline descriptor: hand-read from NSLS2/srx-profile-collection, NOT authoritative.
# Every device carries new: true and a confirm note. Grouping by stage is a placeholder;
# Family suggestions and enclosures need human curation, and any new Family needs the
# naming-r3 gate. Do not copy into deployments/ without review. All PV prefixes were
# verified verbatim against source (startup/*.py), zero fabrications.

beamline:
  maturity: model
  evidence: controls_config
  coverage: partial
  name: SRX
  facility: nsls2
  tier: Unit
  source: unknown-pending-confirmation
enclosures:
- name: 5-ID-A
  facility_code: nsls2
  confirm: optics hutch; inferred from PV prefix XF:05IDA and station labels
- name: 5-ID-B
  facility_code: nsls2
  confirm: secondary-source-aperture hutch; inferred from XF:05IDB
- name: 5-ID-D
  facility_code: nsls2
  confirm: endstation hutch (micro + nano stations); inferred from XF:05IDD
source:
  stage: source
  intro: Candidate grouping by inferred stage; grouping and stage need confirm.
  devices:
  - name: WhiteBeamShutter
    family: Shutter
    pv: "XF:05ID-PPS{Sh:WB}"
    new: true
    confirm: white-beam PPS shutter; family Shutter (catalog)
  - name: PhotonShutter2
    family: Shutter
    pv: "XF:05IDA-PPS:1{PSh:2}"
    new: true
    confirm: photon shutter 2; family Shutter (catalog)
  - name: PhotonShutter4
    family: Shutter
    pv: "XF:05IDB-PPS:1{PSh:4}"
    new: true
    confirm: photon shutter 4; family Shutter (catalog)
  - name: FastShutter
    family: Shutter
    pv: "XF:05IDD{FS:1}"
    new: true
    confirm: endstation fast shutter (Open/Close-Cmd); family Shutter (catalog)
optics:
  stage: source
  intro: Candidate grouping by inferred stage; grouping and stage need confirm.
  devices:
  - name: WhiteBeamSlit
    family: Slit
    pv: "XF:05IDA-OP:1{Slt:1-Ax:"
    new: true
    confirm: 'white-beam slit (SRXSlitsWB); axis suffix composed in source; family Slit (catalog)'
    source_class: srx.optics.SRXSlitsWB
  - name: PinkBeamSlit
    family: Slit
    pv: "XF:05IDA-OP:1{Slt:2-Ax:"
    new: true
    confirm: 'pink-beam slit (SRXSlitsPB); family Slit (catalog)'
    source_class: srx.optics.SRXSlitsPB
  - name: HorizontalFocusingMirror
    family: Mirror
    pv: "XF:05IDA-OP:1{Mir:1-Ax:"
    new: true
    confirm: 'HFM (SRXHFM) with fine_pitch at -Ax:PF (E-SP/E-I); family Mirror (catalog)'
    source_class: srx.optics.SRXHFM
  - name: Monochromator
    family: Monochromator
    pv: "XF:05IDA-OP:1{Mono:HDCM-Ax:"
    new: true
    confirm: 'HDCM (SRXDCM); p/x2 motors + piezo roll/pitch PVPositionerPC; family Monochromator (catalog)'
    source_class: srx.optics.SRXDCM
  - name: SSASlit
    family: Slit
    pv: "XF:05IDB-OP:1{Slt:SSA-Ax:"
    new: true
    confirm: 'secondary source aperture (SRXSSACalc + blades ssa_ob/ssa_ib); family Slit (catalog)'
    source_class: srx.optics.SRXSSACalc
  - name: KBSlit
    family: Slit
    pv: "XF:05IDD-OP:1{Slt:KB-Ax:"
    new: true
    confirm: KB-mirror entrance slit (microES); family Slit (catalog)
  - name: NanoKBHorizontal
    family: Mirror
    pv: "XF:05IDD-ES:1{nKB:horz-Ax:"
    new: true
    confirm: 'nanoES horizontal KB mirror; x/pc/pfpi axes; family Mirror (catalog)'
  - name: NanoKBVertical
    family: Mirror
    pv: "XF:05IDD-ES:1{nKB:vert-Ax:"
    new: true
    confirm: 'nanoES vertical KB mirror; y/pc/pfpi axes; family Mirror (catalog)'
sample:
  stage: sample
  intro: Candidate grouping by inferred stage; grouping and stage need confirm.
  devices:
  - name: MicroSampleStage
    family: LinearStage
    pv: "XF:05IDD-ES:1{Det:3-Ax:"
    new: true
    confirm: 'microES sample/detector stage block; family LinearStage (catalog)'
  - name: NanoSampleStage
    family: LinearStage
    pv: "XF:05IDD-ES:1{nKB:Smpl-Ax:"
    new: true
    confirm: 'nanoES sample stage; coarse sx/sy/sz + fine ssx/ssy/ssz + th/xth/zth; family LinearStage (catalog)'
  - name: NanoVisualMicroscope
    family: GenericProbe
    pv: "XF:05IDD-ES:1{nKB:VLM-Ax:"
    new: true
    confirm: 'on-axis visual-light microscope (sample viewing); LOOSE, likely Camera+stage not the X-ray Microscope family; do NOT bind Microscope without confirm'
detection:
  stage: detection
  intro: Candidate grouping by inferred stage; grouping and stage need confirm.
  devices:
  - name: NanoDetectorStage
    family: LinearStage
    pv: "XF:05IDD-ES:1{nKB:Det-Ax:"
    new: true
    confirm: 'nanoES detector stage; x/y/z + dist; family LinearStage (catalog)'
  - name: IonChamber
    family: FluxMonitor
    pv: "XF:05IDA-BI:1{IM:1}Int-I"
    new: true
    confirm: 'I0 ion chamber current; family FluxMonitor (catalog, graduated)'
  - name: Preamps
    family: GenericProbe
    pv: "XF:05IDD-CT{SR570:1}"
    new: true
    confirm: 'SR570 current preamps (SR570:1/2/3 = I0/Im/It); LOOSE GenericProbe'
  - name: QuadEMBPM
    family: FluxMonitor
    pv: "XF:05ID-BI{EM:BPM1}"
    new: true
    confirm: 'NSLS-II electrometer BPMs (EM:BPM1/BPM2); intensity side FluxMonitor, position side held DIAG-1; split per use'
  - name: AH501BPM
    family: GenericProbe
    pv: "XF:05IDA-BI{BPM:01}AH501:"
    new: true
    confirm: 'AH501 4-channel current BPMs (BPM:01/02/05); LOOSE, held DIAG-1'
  - name: FluorescenceSpectrometer
    family: EnergyDispersiveSpectrometer
    pv: "XF:05IDD-ES{Xsp:3}:"
    new: true
    confirm: 'Xspress3 SDD fluorescence; family EnergyDispersiveSpectrometer (catalog, graduated)'
  - name: ScalerCounter
    family: GenericProbe
    pv: "XF:05IDD-ES:1{Sclr:1}"
    new: true
    confirm: scaler; LOOSE GenericProbe
  - name: Zebra
    family: TimingController
    pv: "XF:05IDD-ES:1{Dev:Zebra1}"
    new: true
    confirm: 'fly-scan pulse/gate generator; TimingController (catalog) - confirm it presents the timing role vs a bare probe'
  - name: MerlinDetector
    family: Camera
    pv: "XF:05IDD-ES{Merlin:1}"
    new: true
    confirm: Merlin photon-counting area detector; family Camera (catalog)
  - name: DexelaDetector
    family: Camera
    pv: "XF:05IDD-ES{Dexela:1}"
    new: true
    confirm: Dexela flat-panel (XRD mode); family Camera (catalog)
  - name: EigerDetector
    family: Camera
    pv: "XF:05IDD-ES{Det:Eig1M}"
    new: true
    confirm: Eiger 1M area detector; family Camera (catalog)
