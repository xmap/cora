# CANDIDATE beamline descriptor: hand-read from NSLS2/fxi-profile-collection, NOT authoritative.
# Every device carries new: true and a confirm note. Grouping by stage is a placeholder;
# Family suggestions and enclosures need human curation, and any new Family needs the
# naming-r3 gate. Do not copy into deployments/ without review. All PV prefixes verified
# verbatim against source. NOTE: the TXM optics classes (condenser/zoneplate/aperture/
# phase-ring/Bertrand/sample-stage) all take the bare XF:18IDB-OP base in source and add
# per-axis leaves internally; the distinguishing leaf per Asset is confirm-pending.

