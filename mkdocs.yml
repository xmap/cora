site_name: CORA
site_description: The system of record for the experiment, at large-scale research facilities
site_url: https://xmap.github.io/cora/
site_author: Doga Gursoy

repo_url: https://github.com/xmap/cora
repo_name: xmap/cora
edit_uri: edit/main/docs/
# Absolute URLs only: mkdocs does not depth-rewrite links in the copyright, so
# a relative one resolves against the current page and 404s everywhere but root.
copyright: >
  <a href="https://github.com/xmap/cora/blob/main/LICENSE">Apache-2.0</a> licensed.

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - Model: architecture/model.md
    - State: architecture/state.md
    - Surfaces: architecture/surfaces.md
    - Standards: architecture/standards.md
    - Modules:
      - architecture/modules/index.md
      - Run: architecture/modules/run/index.md
      - Safety: architecture/modules/safety/index.md
      - Caution: architecture/modules/caution/index.md
      - Calibration: architecture/modules/calibration/index.md
      - Agent: architecture/modules/agent/index.md
      - Campaign: architecture/modules/campaign/index.md
      - Operation: architecture/modules/operation/index.md
      - Supply: architecture/modules/supply/index.md
      - Access: architecture/modules/access/index.md
      - Equipment: architecture/modules/equipment/index.md
      - Recipe: architecture/modules/recipe/index.md
      - Trust: architecture/modules/trust/index.md
      - Subject: architecture/modules/subject/index.md
      - Data: architecture/modules/data/index.md
      - Decision: architecture/modules/decision/index.md
      - Federation: architecture/modules/federation/index.md
      - Enclosure: architecture/modules/enclosure/index.md
      - Budget: architecture/modules/budget/index.md
  - Stack:
    - stack/index.md
    - Run it locally: stack/run.md
    - Backend: stack/backend.md
    - Frontend: stack/frontend.md
    - Data: stack/data.md
    - Auth: stack/auth.md
    - Observability: stack/observability.md
    - Operations: stack/operations.md
    - Deployment: stack/deployment.md
    - Deferred: stack/deferred.md
  - Deployments:
    - deployments/index.md
    - APS:
      - deployments/aps/index.md
      - 2-BM:
        - deployments/2-bm/index.md
        - Source: deployments/2-bm/source.md
        - Sample: deployments/2-bm/sample_tower.md
        - Detector: deployments/2-bm/microscope.md
        - Controls: deployments/2-bm/controls.md
        - Inventory: deployments/2-bm/inventory.md
        - Techniques: deployments/2-bm/techniques.md
        - Operations:
          - deployments/2-bm/operations.md
          - Procedures: deployments/2-bm/procedures.md
          - Recipes: deployments/2-bm/recipes.md
          - First conduct runbook: deployments/2-bm/first-conduct-runbook.md
          - Enclosures: deployments/2-bm/enclosures.md
          - Cautions: deployments/2-bm/cautions.md
        - Experiment: deployments/2-bm/experiment.md
        - Governance: deployments/2-bm/governance.md
        - Authorization rollout runbook: deployments/2-bm/authorization-rollout-runbook.md
        - LLM debrief comparison: deployments/2-bm/llm_debrief.md
        - Model: deployments/2-bm/model.md
        - Open questions: deployments/2-bm/questions.md
    - MAX IV: deployments/maxiv/index.md
    - Diamond: deployments/diamond/index.md
    - NSLS-II: deployments/nsls2/index.md
    - SLAC: deployments/slac/index.md
    - Australian Synchrotron: deployments/as/index.md
    - ESRF: deployments/esrf/index.md
    - PSI: deployments/psi/index.md
    - Sirius: deployments/sirius/index.md
    - Elettra: deployments/elettra/index.md
    - ALBA: deployments/alba/index.md
    - NSRRC: deployments/nsrrc/index.md
    - PETRA III: deployments/petra-iii/index.md
    - ALS: deployments/als/index.md
  - Catalog:
    - catalog/index.md
    - Capabilities: catalog/capabilities.md
    - Methods: catalog/methods.md
    - Families: catalog/families.md
    - Assemblies: catalog/assemblies.md
    - Roles: catalog/roles.md
    - Models: catalog/models.md
  # Hidden from the public site (sources kept, see exclude_docs below).
  # - Blog:
  #   - blog/index.md
  - Talks: talks.md
  # - Demos:
  #   - Replay scrubber: scrubber.md
  - Reference:
    - reference/index.md
    - Workflow: reference/workflow.md
    - Layout: reference/layout.md
    - Modeling: reference/modeling.md
    - Affordances: reference/affordances.md
    - Patterns: reference/patterns.md
    - Conventions: reference/conventions.md
    - Naming: reference/naming.md
    - Runtime: reference/runtime.md
    - Glossary: reference/glossary.md
    - Contributing: reference/contributing.md
    - Security: reference/security.md
    - Cite CORA: reference/cite.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hero-fade.js
  - javascripts/nav-transition.js
  - javascripts/section-reveal.js
  - javascripts/nav-theme.js
  - javascripts/toc-active.js
  # Loaded by the hidden scrubber demo only; it returns immediately when the
  # page has no #cora-scrubber element, so it was 29 KB of inert weight on all
  # 802 pages. Comes back with the Papers tab and its demo page.
  # - javascripts/scrubber-demo.js

plugins:
  - search
  # Blog is hidden from the public site; re-enable together with the nav entry.
  # - blog:
  #     blog_dir: blog
  #     post_excerpt: optional

hooks:
  - scripts/mkdocs_hooks.py

# The module-page authoring template moved to scripts/templates/module_page.md.
# not_in_nav only hides a page from the nav: it still builds, still enters the
# sitemap, and still enters the search index, which is how a placeholder
# skeleton ended up publicly searchable.
not_in_nav: ""

# Kept in the repo, kept off the published site. Dropping these lines (and
# uncommenting the nav entries plus the blog plugin above) brings them back.
exclude_docs: |
  blog/
  scrubber.md
  projects/
  javascripts/scrubber-demo.js
  javascripts/lights_out_run.json

# Note: contributing.md is staged into docs/ at build time from the repo
# root CONTRIBUTING.md by .github/workflows/docs.yml (see scripts/stage_docs.py).
# For local `mkdocs serve` it is absent and mkdocs will warn; build with
# `make docs-build` to stage it first. index.md is hand-crafted and lives in docs/.
strict: false

validation:
  nav:
    # Most deployment pages (all but the 2-BM pilot) are reachable from their
    # Site's roster and their own index.md "More" links, not force-listed in
    # nav, so a built-but-unlisted page is expected here, not a mistake.
    omitted_files: ignore
  links:
    anchors: warn
