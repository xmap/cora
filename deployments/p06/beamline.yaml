      new: true
      confirm: true
      note: "NC1 nano-positioning motor bank (nat_mot01..32, 20 modellable axes on p06/motor/na.*); per-axis roles not labelled, grouped as one stage (GROUP-1)"
    - name: NC1Slits
      family: Slit
      pv: {h_gap: "p06/vmexecutor/shg", h_offset: "p06/vmexecutor/sho", v_gap: "p06/vmexecutor/svg", v_offset: "p06/vmexecutor/svo"}
