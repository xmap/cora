      pv: {u: "p06/aerotechmotor/lab.02", v: "p06/aerotechmotor/lab.01", z: "p06/aerotechmotor/lab.03", scanx: "p06/vmexecutor/scanx", scany: "p06/vmexecutor/scany"}
      new: true
      confirm: true
      note: "NC1 Aerotech scanning stage (scanu / scanv / scanz) plus virtual scanx / scany; the continuous fly-scan raster axes (SCAN-1)"
    - name: NanoPositioningStage
