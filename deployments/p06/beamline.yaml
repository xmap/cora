# ===========================================================================
# DETECTION: the shared detector pool (Maia, area detectors, fluorescence)
# ===========================================================================

detection:
  stage: detection
  enclosure: p06-mc01
  intro: "The shared P06 detector pool: the Maia XRF detector array (the high-rate fluorescence-mapping detector and its sub-systems), the area detectors (Eiger, Lambda, Pilatus, PCO), and the XIA fluorescence detectors. The detectors serve both endstations per experiment."
  note: "The Maia is a multi-element XRF detector array exposed as several Tango devices (maiadimension / maiaflux / maiasensor / maiainterlock / maialogger / maiaprocessing); modelled as one EnergyDispersiveSpectrometer Asset carrying its sub-device handles. The area detectors and XIA detectors report on a bare p06 / petra3 host (HOST-1); the operative roster per experiment is DET-1."
  devices:
    - name: MaiaDetector
      family: EnergyDispersiveSpectrometer
      pv: {dimension0: "p06/maiadimension/exp.00", dimension1: "p06/maiadimension/exp.01", dimension2: "p06/maiadimension/exp.02", flux0: "p06/maiaflux/exp.00", flux1: "p06/maiaflux/exp.01", sensor: "p06/maiasensor/exp.01", interlock: "p06/maiainterlock/exp.01", logger: "p06/maialogger/exp.01", processing: "p06/maiaprocessing/exp.01"}
      new: true
      confirm: true
      note: "Maia high-rate XRF detector array (the dimension / flux / sensor / interlock / logger / processing sub-devices); the scanning-fluorescence-microscopy mapping detector, modelled as one EnergyDispersiveSpectrometer (DET-1)"
    - name: XIAFluorescence
      family: EnergyDispersiveSpectrometer
      pv: {xia01: "p06/xia/p06.1", xia02: "p06/xia/p06.2", xia03: "p06/xia/p06.3", xia04: "p06/xia/p06.4", lab: "p06/xia/exp.1"}
      new: true
      confirm: true
      note: "XIA multi-channel-analyzer fluorescence detectors (p06_xia01..04 plus the lab unit); energy-dispersive fluorescence detection (DET-1)"
    - name: EigerDetector
      family: Camera
      pv: {eiger: "p06/eigerdectris/exp.01"}
      new: true
      confirm: true
      note: "DECTRIS Eiger area detector; diffraction / scanning-diffraction imaging (DET-1)"
    - name: LambdaDetector
      family: Camera
      pv: {lambda: "petra3/lambda/01"}
      new: true
      confirm: true
      note: "X-Spectrum Lambda area detector; reports on the petra3 host (HOST-1); diffraction imaging (DET-1)"
    - name: PilatusDetector
      family: Camera
      pv: {pilatus: "p06/pilatus/300k", pilatus2: "P06/pilatus/300k2"}
      new: true
      confirm: true
      note: "DECTRIS Pilatus 300k area detectors (two units); diffraction imaging (DET-1)"
    - name: PCODetector
      family: Camera
      pv: {pco4000: "p06/ccd/pco4000"}
      new: true
      confirm: true
      note: "PCO 4000 CCD camera; imaging / visible-light diagnostics (DET-1)"
    - name: XrayEyeCamera
      family: Camera
      pv: {xrayeye: "p06/prosilica/xrayeye.01"}
      new: true
      confirm: true
      note: "X-ray-eye Prosilica viewing camera; beam / sample viewing (DET-1)"

# Cross-cutting control. P06 runs Tango with Sardana, the PETRA III house style.
controls:
  intro: >
    P06 runs on the PETRA III control system, Tango with Sardana as the scan / motion
    SCADA layer, the same floor as P01 and P04. P06 is the most controller-diverse
    PETRA III beamline modelled so far: alongside the OMS MAXv-58 steppers it runs
    hexapod controllers (hexapodmotor, hexasmarmotor), SmarAct piezo controllers
    (smaractmotor), Aerotech fly-scan controllers (aerotechmotor), PI piezo
    controllers (piezopi, piezopie871), SMC-Hydra controllers (hydramotor), and
    Pegasus controllers (pegasusmotor), with the Maia XRF array and the Eiger /
    Lambda / Pilatus / PCO detectors. The handles are read from P06's public OnlineXML
    registry and carried confirm (CTRL-1). The scanning fluorescence / diffraction
    microscopy acquisition (the Aerotech raster fly-scan coupled to the Maia readout)
    runs as a Sardana macro; that orchestration is the seam CORA's edge conducts over
    its ControlPort (CTRL-2).
  motion_controllers:
    - name: OMS58Controllers
      family: MotionController
      protocol: Tango_oms58
      new: true
      confirm: true
      note: "OMS MAXv-58 stepper controllers (oms58) driving the mono, mi, and nat motor banks (CTRL-1)"
    - name: AerotechControllers
      family: MotionController
      protocol: Tango_aerotech
      new: true
      confirm: true
      note: "Aerotech fly-scan motion controllers driving the MC01 / NC1 scanning raster stages (SCAN-1, CTRL-1)"
    - name: SmarActControllers
      family: MotionController
      protocol: Tango_smaract
      new: true
      confirm: true
      note: "SmarAct piezo controllers (smaractmotor, hexasmarmotor) driving the nano-probe hexapods and sample piezos (CTRL-1)"
    - name: HexapodControllers
      family: MotionController
      protocol: Tango_hexapod
      new: true
      confirm: true
      note: "hexapod motion controllers (hexapodmotor) driving the MC01 six-axis hexapod (CTRL-1)"
    - name: PiezoControllers
      family: MotionController
      protocol: Tango_piezo
      new: true
      confirm: true
      note: "PI piezo controllers (piezopi, piezopie871) and SMC-Hydra controllers (hydramotor) driving the fine sample stages (CTRL-1)"
    - name: TangoMotorControllers
      family: MotionController
      protocol: Tango_motor_tango
      new: true
      confirm: true
      note: "generic Tango motor controllers (motor_tango) backing the mono, undulator, virtual, and Pegasus axes (CTRL-1)"

# Continuously-available resources a run draws on.
resources:
  intro: >
    The continuously-available facility resources a P06 run needs present before it
    can start. All pending confirmation.
  supplies:
    - kind: PhotonBeam
    - kind: CoolingWater
    - kind: Vacuum
