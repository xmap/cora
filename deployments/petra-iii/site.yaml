# CORA Site descriptor: the PETRA III (DESY) site-level surface
#
# PETRA III is the 2.3 km hard X-ray synchrotron at DESY (Deutsches
# Elektronen-Synchrotron, Hamburg-Bahrenfeld, Germany). It is the Site CORA models
# for its DESY deployment, and the home of the P01 beamline scaffold (the first
# PETRA III deployment). This file is the single human-readable source for the
# facility's site-level instances: the Facility itself, the Practices it would run,
# and the facility principals.
#
# Status: reverse-engineered. CORA has not been connected to PETRA III and no staff
# have confirmed this model. Every value below is read from public open source (the
# gitlab.desy.de tango-ds / fsec-sardana / petra-iii-debian-packages control trees,
# the photon-science.desy.de beamline catalog) or inferred, and is carried as `pending` until staff
# confirm it. Do not invent facility specifics here; carry them as questions on each
# beamline's open-questions page.
#
# Source-of-truth boundary (same as the APS / ESRF / MAX IV / Diamond / NSLS-II /
# SLAC / NSRRC / Sirius sites):
#   - the closed facility-kind / actor-kind vocabularies are validated against
#     code-mirrored frozensets in scripts/site_descriptor.py.
#   - the facility records the bootstrap invariants (kind=Site, display_name equals
#     code); `heading` carries the human title used on the rendered page.
#
# Controls house-style (the distinctive Site fact): PETRA III runs a Tango control
# floor with Sardana as the scan / motion SCADA layer (Pool / MacroServer /
# MeasurementGroup, Spock CLI, Taurus UIs), NOT EPICS. Each beamline's device tree
# is published as an OnlineXML registry (online_*.xml: Tango device name, class,
# address, host) under petra-iii-debian-packages on gitlab.desy.de, and the device
# servers live in tango-ds/deviceclasses. This is the second Tango / Sardana house
# style CORA models (after MAX IV) and a sibling of the ESRF BLISS / Tango floor.
# DESY also runs DOOCS / TINE for the accelerator, which is out of beamline scope.
# CORA's EdgeConductor would conduct routines over the Tango floor where Sardana's
# MacroServer sits today. See docs/deployments/p01/equipment/controls.md.

facility:
  code: petra-iii
  display_name: petra-iii
  heading: "PETRA III"
  kind: Site
  institution: DESY (Deutsches Elektronen-Synchrotron, Hamburg, Germany)
  beamlines: [P01, P04, P06, P11, P03, P10, P09, P02, P64, P65, P07, P08, P21, P22, P23, P24]

# ISA-88 Site Recipes: the facility-adapted form of a catalog Method.
#
# P01 (Dynamics): nuclear resonant scattering (NRS) and inelastic / resonant
# inelastic X-ray scattering (IXS / RIXS). None of CORA's catalog Methods (all
# tomography-family today) fit, so every P01 practice is pending, naming the Method
# it would earn. RIXS reuses the resonant_inelastic_scattering slug SIX left pending
# and ESRF ID32 shares; IXS reuses the inelastic_x_ray_scattering slug NSLS-II IXS
# left pending and ESRF ID28 shares. Confirm with DESY staff (TECH-1).
practices:
  - {name: P01_nuclear_resonant_scattering_practice, method: inelastic_x_ray_scattering, pending: true, note: "nuclear resonant scattering / nuclear inelastic scattering (Moessbauer-energy-resolution time- and energy-domain) on the high-resolution monochromator stack + avalanche-photodiode detection; no catalog Method fits, reuses the inelastic_x_ray_scattering slug ID28 / NSLS-II IXS share, a further consumer (TECH-1)"}
  - {name: P01_rixs_practice, method: resonant_inelastic_scattering, pending: true, note: "resonant inelastic X-ray scattering on the EH3 KB-focused spectrometer endstation; reuses the resonant_inelastic_scattering slug SIX / ESRF ID32 share, a further consumer (TECH-1)"}
  # P04 (Variable Polarization XUV): soft X-ray spectroscopy, 250-3000 eV. Soft X-ray
  # absorption reuses the xas_spectroscopy slug 4 sites share; photoemission reuses the
  # angle_resolved_photoemission slug. Both pending until DESY staff confirm (TECH-1).
  - {name: P04_xas_practice, method: xas_spectroscopy, pending: true, note: "soft X-ray absorption spectroscopy (total electron yield via the drain-current electrometer) over the undulator + plane-grating-monochromator photon-energy scan; reuses the xas_spectroscopy slug, a further consumer (TECH-1)"}
  - {name: P04_photoemission_practice, method: angle_resolved_photoemission, pending: true, note: "soft X-ray photoemission on the EXP endstations; reuses the angle_resolved_photoemission slug, a further consumer (TECH-1)"}
  # P06 (Micro- and Nanoprobe): hard X-ray scanning fluorescence / diffraction
  # microscopy + nano-tomography. Scanning XRF reuses the scanning_fluorescence_
  # microscopy slug 4 sites share; nano-tomography reuses the tomography slug. Both
  # pending until DESY staff confirm (TECH-1).
  - {name: P06_scanning_fluorescence_microscopy_practice, method: scanning_fluorescence_microscopy, pending: true, note: "hard X-ray scanning fluorescence / diffraction microscopy: the Aerotech raster fly-scan over the micro / nano focus reading the Maia XRF array; reuses the scanning_fluorescence_microscopy slug 2-ID / XFM / LIX / ESRF ID16B share, a further consumer (TECH-1)"}
  - {name: P06_nanotomography_practice, method: tomography, pending: true, note: "hard X-ray nano-tomography on the NC1 sample rotation (Pegasus samr) + area detector; reuses the catalog tomography Method, a further consumer (TECH-1)"}
  # P11 (Bio-Imaging and Diffraction): high-throughput rotation macromolecular
  # crystallography + bio-imaging. MX reuses the i03 mx_data_collection slug 7 sites
  # share; bio-imaging reuses the tomography slug. Both pending until DESY staff
  # confirm (TECH-1).
  - {name: P11_mx_data_collection_practice, method: mx_data_collection, pending: true, note: "rotation / oscillation macromolecular-crystallography data collection on the goniometer + Pilatus area detector with cryostream cooling; reuses the i03 mx_data_collection slug FMX / AMX / MX3 / MANACA / TPS share, a further consumer (TECH-1)"}
  - {name: P11_bioimaging_practice, method: tomography, pending: true, note: "full-field / coherent bio-imaging on the experiment-hutch stages + Pilatus detector; reuses the catalog tomography Method, a further consumer (TECH-1)"}
  # P03 (MiNaXS): micro- and nanofocus small- and wide-angle X-ray scattering, 9-23
  # keV, across a microfocus and a nanofocus GINIX endstation. SAXS reuses the
  # small_angle_scattering slug, WAXS the wide_angle_scattering slug. Both pending
  # until DESY staff confirm (TECH-1).
  - {name: P03_small_angle_scattering_practice, method: small_angle_scattering, pending: true, note: "micro- and nanofocus small-angle X-ray scattering on the sample stage + Pilatus area detector; reuses the small_angle_scattering slug, a further consumer (TECH-1)"}
  - {name: P03_wide_angle_scattering_practice, method: wide_angle_scattering, pending: true, note: "wide-angle X-ray scattering on the Pilatus 1M detector; reuses the wide_angle_scattering slug, a further consumer (TECH-1)"}
  # P10 (Coherence Applications): XPCS + coherent imaging. XPCS binds the GRADUATED
  # catalog xpcs Method (8-ID precedent), so this practice is NOT pending, the first
  # PETRA III practice whose Method is already earned. Coherent imaging reuses the
  # pending ptychography / coherent_surface_scattering slugs (TECH-1).
  - {name: P10_xpcs_practice, method: xpcs, note: "X-ray photon correlation spectroscopy: the coherent beam on the sample read by the high-frame-rate Lambda / Eiger, the intensity correlation computed downstream; binds the graduated xpcs Method (8-ID), the second consumer"}
  - {name: P10_ptychography_practice, method: ptychography, pending: true, note: "coherent diffraction imaging / ptychography on the E1 endstation + Quadro / Eiger detector; reuses the ptychography slug, a further consumer (TECH-1)"}
  # P09 (Resonant Scattering and Diffraction): resonant scattering, magnetic
  # scattering / XMCD, and diffraction across a resonant-scattering hutch, a diffraction
  # hutch, and a 14 T magnetism endstation. Resonant scattering reuses the
  # resonant_scattering slug; magnetic scattering / XMCD reuse the magnetic_scattering /
  # xmcd slugs the 4-ID / i06 / i10 beamlines share. All pending (TECH-1).
  - {name: P09_resonant_scattering_practice, method: resonant_scattering, pending: true, note: "resonant elastic X-ray scattering on the six-circle diffractometer + PerkinElmer / Pilatus detector, with polarization analysis; reuses the resonant_scattering slug 4-ID / i06 / i10 share, a further consumer (TECH-1)"}
  - {name: P09_magnetic_scattering_practice, method: magnetic_scattering, pending: true, note: "magnetic scattering in the 14 T high-field magnetism endstation; reuses the magnetic_scattering slug, a further consumer (TECH-1)"}
  - {name: P09_xmcd_practice, method: xmcd, pending: true, note: "X-ray magnetic circular / linear dichroism in the 14 T magnet, with the phase retarder setting polarization; reuses the 4-ID / i06 / i10 xmcd slug, a further consumer (TECH-1)"}
  # P02 (Hard X-ray Diffraction): P02.1 powder diffraction / total scattering / PDF +
  # P02.2 extreme conditions (diamond-anvil-cell high-pressure diffraction). Powder
  # reuses the powder_diffraction slug, total scattering the total_scattering slug.
  # Both pending until DESY staff confirm (TECH-1).
  - {name: P02_powder_diffraction_practice, method: powder_diffraction, pending: true, note: "high-energy powder diffraction on the P02.1 endstation + Pilatus 1M; reuses the powder_diffraction slug i11 / XPD share, a further consumer (TECH-1)"}
  - {name: P02_total_scattering_practice, method: total_scattering, pending: true, note: "total scattering / pair-distribution-function on the P02.1 PerkinElmer flat-panel (high-Q); reuses the total_scattering slug i15-1 / XPD share, a further consumer (TECH-1)"}
  - {name: P02_high_pressure_diffraction_practice, method: powder_diffraction, pending: true, note: "diamond-anvil-cell high-pressure diffraction on the P02.2 extreme-conditions endstation; reuses the powder_diffraction slug, a further consumer (TECH-1, PRESSURE-1)"}
  # P64 + P65 (X-ray absorption spectroscopy pair): advanced fluorescence EXAFS (P64)
  # and applied / high-throughput EXAFS (P65), sharing the hasnp64 optics host. Both
  # reuse the xas_spectroscopy slug BMM / ISS / i20-1 / P04 share. Pending (TECH-1).
  - {name: P64_xas_practice, method: xas_spectroscopy, pending: true, note: "advanced X-ray absorption spectroscopy (dilute high-rate fluorescence EXAFS / XANES) on the Tsai DCM + multi-element fluorescence detector; reuses the xas_spectroscopy slug, a further consumer (TECH-1)"}
  - {name: P65_xas_practice, method: xas_spectroscopy, pending: true, note: "applied / high-throughput X-ray absorption spectroscopy (transmission + fluorescence EXAFS / XANES) on the CDCM energy scan; reuses the xas_spectroscopy slug, a further consumer (TECH-1)"}
  # P07 (HEMS, Hereon-operated): high-energy materials-science diffraction + high-field
  # studies. Diffraction reuses the diffraction slug; the 17 T magnet work reuses the
  # magnetic_scattering slug. Both pending until DESY / Hereon staff confirm (TECH-1).
  - {name: P07_diffraction_practice, method: diffraction, pending: true, note: "high-energy materials-science diffraction on the four-circle diffractometer + Pilatus / PerkinElmer; reuses the diffraction slug, a further consumer (TECH-1)"}
  - {name: P07_magnetic_scattering_practice, method: magnetic_scattering, pending: true, note: "high-field materials studies in the 17 T magnet; reuses the magnetic_scattering slug P09 / 4-ID share, a further consumer (TECH-1)"}
  # P08 (High Resolution Diffraction): surface / interface diffraction, reflectivity,
  # and high-resolution diffraction on a six-circle Kohzu diffractometer. Reuses the
  # diffraction slug, pending until DESY staff confirm (TECH-1).
  - {name: P08_diffraction_practice, method: diffraction, pending: true, note: "high-resolution surface / interface diffraction and reflectivity on the six-circle Kohzu diffractometer + Eiger / Pilatus / Mythen; reuses the diffraction slug, a further consumer (TECH-1)"}
  # P21 (Swedish Materials Science): high-energy diffraction (P21.2) + total scattering
  # / PDF (P21.1). Reuses the diffraction / total_scattering slugs, pending until DESY
  # staff confirm (TECH-1).
  - {name: P21_diffraction_practice, method: diffraction, pending: true, note: "high-energy materials-science diffraction on the P21.2 / EH3 endstations; reuses the diffraction slug, a further consumer (TECH-1)"}
  - {name: P21_total_scattering_practice, method: total_scattering, pending: true, note: "high-energy total scattering / pair-distribution-function on the P21.1 branch; reuses the total_scattering slug i15-1 / XPD / P02 share, a further consumer (TECH-1)"}
  # P22 (HAXPES): hard X-ray photoelectron spectroscopy, sharing the P09 optics chain.
  # Reuses the angle_resolved_photoemission slug P04 shares, pending until DESY staff
  # confirm (TECH-1).
  - {name: P22_haxpes_practice, method: angle_resolved_photoemission, pending: true, note: "hard X-ray photoelectron spectroscopy on the shared P09 optics + the HAXPS electron analyzer; reuses the angle_resolved_photoemission slug P04 shares, a further consumer (TECH-1)"}
  # P23 (In-situ X-ray Diffraction): in-situ / operando diffraction and imaging. Reuses
  # the diffraction slug, pending until DESY staff confirm (TECH-1).
  - {name: P23_diffraction_practice, method: diffraction, pending: true, note: "in-situ / operando X-ray diffraction on the experiment diffractometer; reuses the diffraction slug P07 / P08 / P21 share, a further consumer (TECH-1)"}
  # P24 (Chemical Crystallography): single-crystal / small-molecule chemical
  # crystallography. Reuses the diffraction slug (no chemical-crystallography Method
  # exists), pending until DESY staff confirm (TECH-1).
  - {name: P24_chemical_crystallography_practice, method: diffraction, pending: true, note: "single-crystal / small-molecule chemical crystallography on the EH2 diffractometer + area detector; reuses the diffraction slug (no dedicated chemical-crystallography Method exists), a further consumer (TECH-1)"}

# Access BC Actors conceptually facility-wide at PETRA III. Pending until the DESY
# operator and review structure is confirmed.
actors:
  - {name: DESY beamline staff, kind: human, pending: true, note: "beamline scientist and operator pool; structure TBD (GOV-1)"}
  - {name: DESY safety review, kind: human, pending: true, note: "facility safety review body; membership TBD"}

# Agent BC Agents seeded at this deployment. None: the CORA system agents are not
# wired for a PETRA III deployment, and this is a modelling exercise.
agents: []

# Supply BC: facility-wide continuously-available resources. Pending in this
# reverse-engineered model.
supplies:
  - {name: PETRA III photon beam, kind: PhotonBeam, pending: true, note: "PETRA III storage-ring beam, shared across the beamlines (SRC-1)"}
  - {name: Cooling water, kind: CoolingWater, pending: true}
  - {name: Beamline vacuum, kind: Vacuum, pending: true}

# Safety BC: facility-issued Clearances. DESY personnel safety (PSS / interlock) is
# carried pending; the permit-leaf signal names are not in the public OnlineXML
# (which carries beamline devices, not the PSS interlock leaves).
clearances:
  - {name: DESY personnel safety system, kind: PSS, pending: true, note: "facility safety-form and permit-leaf names not in public source; confirm with DESY staff (PSS-1)"}

# Caution BC: operator tribal knowledge. None yet for a modelling exercise;
# beamline-level cautions for P01 live on docs/deployments/p01/.
cautions: []
