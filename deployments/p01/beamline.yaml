  note: "Handles read from p01/motor/eh3.*. The KB pair (kb3h horizontal, kb3v vertical) each carry bender (bu / bd), theta, and a second theta; the bend radii and focal sizes are OPT-1."
  devices:
    - name: KBMirrorHorizontal
      family: Mirror
      pv: {bend_upstream: "p01/motor/eh3.01", bend_downstream: "p01/motor/eh3.02", theta: "p01/motor/eh3.03", theta2: "p01/motor/eh3.04"}
      new: true
      confirm: true
      note: "horizontal-focusing KB mirror (kb3h: upstream / downstream benders + theta / theta2); bend radius and focal size are OPT-1"
    - name: KBMirrorVertical
