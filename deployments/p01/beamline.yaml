      pv: {bend_upstream: "p01/motor/eh3.05", bend_downstream: "p01/motor/eh3.06", theta: "p01/motor/eh3.07", theta2: "p01/motor/eh3.08"}
      new: true
      confirm: true
      note: "vertical-focusing KB mirror (kb3v: upstream / downstream benders + theta / theta2); bend radius and focal size are OPT-1"
    - name: SampleStage
      family: LinearStage
      pv: {x: "p01/motor/eh3.31", y: "p01/motor/eh3.30", b: "p01/motor/eh3.28", rotation: "p01/motor/eh3.32", tilt: "p01/motor/eh3.29"}
      new: true
      confirm: true
      note: "EH3 sample stage (samp: x / y / b / rot / tilt); the RIXS sample positioning and rotation (SAMPLE-1)"
    - name: DetectorSlit
