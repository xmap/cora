      new: true
      confirm: true
      note: "EH2 detector / receiving slit (dslit)"
    - name: DetectorTable
      family: Table
      pv: {x: "p01/motor/eh2.39", y: "p01/motor/eh2.40"}
      new: true
      confirm: true
      note: "EH2 detector table (tab2)"

eh2-detector:
  stage: detection
  enclosure: p01-eh2
  intro: "The EH2 detector positioning stage. The OnlineXML carries the detector carriage axes; the detector device itself (an avalanche photodiode or area detector) is not a motor row and is DET-1."
  note: "Handles read from p01/motor/eh2.* (det_x / det_y). The operative detector model is DET-1."
  devices:
    - name: DetectorStage
      family: LinearStage
      pv: {x: "p01/motor/eh2.29", y: "p01/motor/eh2.30"}
      new: true
      confirm: true
      note: "EH2 detector positioning stage (det: x / y); the detector device (APD / area detector) is not in the motor registry (DET-1)"

