    - name: SecondaryDetectorStage
      family: LinearStage
      pv: {theta: "p01/motor/eh3.25", x: "p01/motor/eh3.26", y: "p01/motor/eh3.27"}
      new: true
      confirm: true
      note: "EH3 secondary detector arm stage (det16: theta / x / y); role / detector is DET-1"

# Cross-cutting control. P01 runs Tango with Sardana as the scan layer; this is
# CORA's second Tango / Sardana deployment (after MAX IV) and a sibling of ESRF BLISS.
controls:
  intro: >
    P01 runs on the PETRA III control system, which is Tango with Sardana as the
    scan / motion SCADA layer, NOT EPICS. This is CORA's second Tango / Sardana
    control floor (after MAX IV) and a sibling of the ESRF BLISS / Tango floor: the
    seam model that today reads "EPICS is the floor" generalizes here to "Tango /
    Sardana is the floor". In this stack a motion axis is a Tango motor device
    addressed by domain/family/member (p01/motor/<hutch>.<n>), a virtual / coupled
    axis is a vmexecutor or attributemotor device, and a scan is a Sardana macro run
    by the MacroServer over a Pool of controllers, with the MeasurementGroup defining
    the acquired channels. The handles in this descriptor are read from P01's public
    OnlineXML registry and carried confirm (CTRL-1). The NRS / RIXS acquisition (the
    high-resolution-monochromator energy scan or the KB-focused spectrometer scan,
    coupled to the detector readout) runs as a Sardana macro; that orchestration is
    the seam CORA's edge would conduct over its ControlPort, driving through or
    replacing the Sardana macro per routine (CTRL-2).
  motion_controllers:
    - name: OMS58Controllers
      family: MotionController
      protocol: Tango_oms58
      new: true
      confirm: true
      note: "OMS MAXv-58 stepper motor controllers (Tango module oms58); the dominant P01 motor controller, fleet-wide the most common PETRA III motor class (CTRL-1)"
    - name: TangoMotorControllers
      family: MotionController
      protocol: Tango_motor_tango
      new: true
      confirm: true
      note: "generic Tango motor controllers (module motor_tango) backing the dcm and virtual-axis devices (CTRL-1)"
    - name: VirtualMotorExecutors
      family: MotionController
      protocol: Tango_vmexecutor
      new: true
      confirm: true
      note: "Sardana virtual-motor executors (vmexecutor) computing the coupled energy / slit-center-gap pseudo axes (CTRL-1)"

# Continuously-available resources a run draws on.
resources:
  intro: >
    The continuously-available facility resources a P01 run needs present before it
    can start. All pending confirmation.
  supplies:
    - kind: PhotonBeam
    - kind: CoolingWater
    - kind: Vacuum
