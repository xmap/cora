# P01 beamline descriptor (PETRA III, DESY), reverse-engineered from the OnlineXML
#
# P01 "Dynamics" is the hard X-ray nuclear-resonant-scattering and inelastic /
# resonant-inelastic-scattering beamline at PETRA III (DESY, Hamburg), 2.5-80 keV.
# It is bound to the PETRA III Site (deployments/petra-iii/site.yaml), and is CORA's
# FIRST PETRA III deployment and second Tango / Sardana control floor (after MAX IV).
#
# STATUS: reverse-engineered from P01's own public OnlineXML device registry
# (gitlab.desy.de/petra-iii-debian-packages/python-nxstools-extras-p01, branch
# debian/jessie; the xml/online_haspp01eh{1,2,3}.xml per-endstation Tango device
# registries). Device logical names and Tango control handles are real, read from
# that registry; vendor part numbers, serials, energy ranges, crystal cuts, and
# physical positions are not in it and are open questions. Every value is carried
# confirm until P01 staff verify it (a registry snapshot is strong evidence, not a
# CORA-owned fact).
#
# WHAT IS NEW: not a device Family. P01's stages bind existing Families
# (Monochromator, Mirror, Slit, Transfocator, LinearStage, RotaryStage, Camera,
# Diffractometer, FluxMonitor). The genuine novelty is twofold: (1) the TECHNIQUE
# (nuclear resonant scattering + IXS / RIXS) earns no catalog Method today, carried
# pending on the Site reusing the inelastic_x_ray_scattering / resonant_inelastic_
# scattering slugs (TECH-1); (2) the CONTROL PLANE: PETRA III runs Tango with Sardana
# as the scan layer, so the seam "EPICS is the floor" generalizes to "Tango / Sardana
# is the floor" (CTRL-1), the same shape as MAX IV and a sibling of ESRF BLISS.
#
# CONTROL HANDLES: the descriptor `pv` field is the opaque control-handle slot (not
# EPICS-specific); for P01 it carries the Tango device address read from the
# OnlineXML (domain/family/member, e.g. p01/motor/eh1.02). A logical axis maps to one
# Tango motor device; a virtual / pseudo motor maps to a vmexecutor or attributemotor
# device. The OnlineXML lists one device per AXIS; CORA groups axes into Assets at the
# stage granularity (the monochromator, the mirror, the sample stage), carrying the
# per-axis Tango handles in the `pv` map. Asset grouping is the human curation step
# over the machine extraction and is carried confirm (GROUP-1).
#
# SCOPE: this cut models all five hutches present in the OnlineXML: two optics hutches
# (OH1 carrying the DCM and the two horizontal-deflection mirrors, OH2 carrying the
# secondary slits and the RIXS pre-optics) and three experiment hutches (EH1 nuclear
# resonant scattering with the high-resolution monochromator stack, EH2 diffraction,
# EH3 RIXS / KB-focused spectroscopy). Counter / timer / ADC channels and the Sardana
# MeasurementGroup bookkeeping rows are filtered out by the extractor and not modelled
# as devices.
#
# Items left open are tagged inline with a (QUESTION-ID) answered on
# docs/deployments/p01/questions.md.

beamline:
  maturity: model
  evidence: controls_config
  coverage: full
  summary: "nuclear resonant scattering and inelastic / resonant-inelastic scattering (2.5-80 keV) across two optics hutches and three experiment hutches (EH1 NRS high-resolution-monochromator stack, EH2 diffraction, EH3 RIXS / KB pair); reuses the optics / motion Families, novelty is the Site, its Tango / Sardana control plane read from the OnlineXML, and the NRS / RIXS technique branch (reusing the pending IXS / RIXS Methods)"
  name: P01
  facility: petra-iii          # PETRA III Site (facility_code: petra-iii)
  sector: "P01"
  tier: Unit
  parent: null
  source: insertion-device
  source_confirm: "P01 is an undulator beamline (2.5-80 keV); the OnlineXML exposes undulator gap/taper virtual motors (gap_a, gap_b, taper_a, taper_b on p01/attributemotor) but no insertion-device period or parameters, carried pending (SRC-1)"

# Five enclosures: two optics hutches carrying the shared source-conditioning optics,
# and three experiment hutches, one per technique branch. DESY PSS permit signals are
# not in the OnlineXML (which carries beamline devices, not the interlock leaves) (PSS-1).
enclosures:
  - name: p01-oh1
    role: optics-hutch
    facility_code: petra-iii
    permit_signal: {confirm: "DESY PSS permit signal for the first optics hutch; not in the OnlineXML (PSS-1)"}
  - name: p01-oh2
    role: optics-hutch
    facility_code: petra-iii
    permit_signal: {confirm: "DESY PSS permit signal for the second optics hutch; not in the OnlineXML (PSS-1)"}
  - name: p01-eh1
    role: experiment-hutch
    facility_code: petra-iii
    permit_signal: {confirm: "DESY PSS permit signal for EH1 (nuclear resonant scattering); not in the OnlineXML (PSS-1)"}
  - name: p01-eh2
    role: experiment-hutch
    facility_code: petra-iii
    permit_signal: {confirm: "DESY PSS permit signal for EH2 (diffraction); not in the OnlineXML (PSS-1)"}
  - name: p01-eh3
    role: experiment-hutch
    facility_code: petra-iii
    permit_signal: {confirm: "DESY PSS permit signal for EH3 (RIXS); not in the OnlineXML (PSS-1)"}

# ===========================================================================
# SOURCE STAGE: the insertion device and the OH1 / OH2 conditioning optics
# ===========================================================================

source:
  stage: source
  enclosure: p01-oh1
  intro: "The P01 undulator source. The OnlineXML exposes the gap and taper as virtual (attributemotor) axes rather than an insertion-device device server; the period and parameters are not published."
  note: "Undulator gap / taper virtual motors on p01/attributemotor; which physical insertion device and its period / harmonics is SRC-1."
  devices:
    - name: Undulator
      family: InsertionDevice
      pv: {gap_a: "p01/attributemotor/gap.01", gap_b: "p01/attributemotor/gap.02", taper_a: "p01/attributemotor/taper.01", taper_b: "p01/attributemotor/taper.02"}
      new: true
      confirm: true
      note: "P01 undulator source; gap_a/gap_b and taper_a/taper_b are virtual axes, suggesting a two-section or canted-undulator arrangement, unconfirmed (SRC-1); energy reach 2.5-80 keV per the DESY catalog"

oh1-optics:
  stage: source
  enclosure: p01-oh1
  intro: "The first optics hutch: the double-crystal monochromator and the two horizontal-deflection mirrors that monochromate and steer the beam, plus the front-end definition slits."
  note: "Handles read from the OnlineXML (p01/dcmmotor, p01/dcmener, p01/motor/oh1.*). The DCM energy / Bragg pseudo-motors are virtual; crystal cut and the mirror coatings / stripes are OPT-1."
  devices:
    - name: Monochromator
      family: Monochromator
      pv: {bragg: "p01/dcmmotor/oh.01", energy: "p01/dcmener/oh.01", lateral: "p01/motor/oh1.08", parallel: "p01/motor/oh1.10", perpendicular: "p01/motor/oh1.09", pitch: "p01/motor/oh1.11", roll: "p01/motor/oh1.02", offset: "p01/attributemotor/fmbexitoffset.01", y: "p01/vmexecutor/dcm_z", y1: "p01/motor/oh1.03", y2: "p01/motor/oh1.04", y3: "p01/motor/oh1.07"}
      new: true
      confirm: true
      note: "double-crystal monochromator (FMB-Oxford-style: dcm_bragg / dcm_ener virtual energy axis, fixed-exit offset, three y jacks); crystal cut (Si 111 / 311) and energy range are OPT-1"
    - name: Mirror1
      family: Mirror
      pv: {pitch: "p01/motor/oh1.17", x: "p01/motor/oh1.18", rotation: "p01/motor/oh1.21", y: "p01/motor/oh1.22"}
      new: true
      confirm: true
      note: "first OH1 deflection / harmonic-rejection mirror (oh1_m1); coating / stripe and incidence angle are OPT-1"
    - name: Mirror2
      family: Mirror
      pv: {pitch: "p01/motor/oh1.25", x: "p01/motor/oh1.26", rotation: "p01/motor/oh1.29", y: "p01/motor/oh1.30"}
      new: true
      confirm: true
      note: "second OH1 deflection mirror (oh1_m2); coating / stripe and incidence angle are OPT-1"
    - name: FrontEndSlit1
      family: Slit
      pv: {center_y: "p01/motor/oh1.12", gap_y: "p01/motor/oh1.05"}
      new: true
      confirm: true
      note: "first front-end definition slit (fe_slit1); vertical center / gap only in the registry (OPT-1)"
    - name: FrontEndSlit2
      family: Slit
      pv: {center_y: "p01/motor/oh1.14", gap_y: "p01/motor/oh1.13", left: "p01/motor/oh1.15", right: "p01/motor/oh1.16"}
      new: true
      confirm: true
      note: "second front-end definition slit (fe_slit2)"

oh2-optics:
  stage: source
  enclosure: p01-oh2
  intro: "The second optics hutch: the secondary defining slits, a diamond beam monitor, and the RIXS pre-optics translation that selects the EH3 spectroscopy branch."
  note: "Handles read from the OnlineXML (p01/motor/oh2.*, p01/vmexecutor/slit1_*). The diamond monitor and rixs translation roles are OPT-1 / DET-1."
  devices:
    - name: SecondarySlit
      family: Slit
      pv: {bottom: "p01/motor/oh2.45", top: "p01/motor/oh2.46", left: "p01/motor/oh2.47", right: "p01/motor/oh2.48", center_x: "p01/vmexecutor/slit1_cx", center_y: "p01/vmexecutor/slit1_cy", gap_x: "p01/vmexecutor/slit1_dx", gap_y: "p01/vmexecutor/slit1_dy"}
      new: true
      confirm: true
      note: "secondary defining slit (slit1: four blades + cx/cy/dx/dy virtual center/gap motors on vmexecutor)"
    - name: DiamondMonitor
      family: FluxMonitor
      pv: {y: "p01/motor/oh2.28"}
      new: true
      confirm: true
      note: "diamond beam-position / flux monitor insert (oh2_diam_y); a single y insertion axis, role is a candidate FluxMonitor (OPT-1)"
    - name: RIXSPreOptic
      family: LinearStage
      pv: {x: "p01/motor/oh2.04"}
      new: true
      confirm: true
      note: "RIXS pre-optic translation (rixs_x); selects / positions the EH3 spectroscopy branch optic, role and optic kind are OPT-1"

# ===========================================================================
# EH1: nuclear resonant scattering (high-resolution monochromator stack)
# ===========================================================================

eh1-sample:
  stage: sample
  enclosure: p01-eh1
  intro: "The EH1 nuclear-resonant-scattering endstation: the high-resolution monochromator stack that carves the meV / Moessbauer-energy bandwidth, the compound refractive lens focusing, the beam-defining slit, and the sample table."
  note: "Four high-resolution monochromators (hrm400 / hrm1064 / hrm3d / hrm3w) are the nested / sapphire backscattering analyzers; which is in beam depends on the isotope and resolution (NRS-1). Handles read from p01/motor/eh1.* and the hrm_ener / hrm_ener2 virtual energy axes."
  devices:
    - name: HighResMono400
      family: Monochromator
      pv: {theta: "p01/motor/eh1.02", tilt: "p01/motor/eh1.01", x: "p01/motor/eh1.04", y: "p01/motor/eh1.03", piezo_theta: "p01/attributemotor/pieh2.49", piezo_tilt: "p01/attributemotor/pieh2.50"}
      new: true
      confirm: true
      note: "high-resolution monochromator, 400 channel-cut (hrm400: theta / tilt / x / y plus piezo fine theta / tilt); the energy-resolution element for one isotope branch (NRS-1)"
    - name: HighResMono1064
      family: Monochromator
      pv: {theta: "p01/motor/eh1.34", tilt: "p01/motor/eh1.33", x: "p01/motor/eh1.36", y: "p01/motor/eh1.35", piezo_theta: "p01/attributemotor/pieh2.51", piezo_tilt: "p01/attributemotor/pieh2.52"}
      new: true
      confirm: true
      note: "high-resolution monochromator, 1064 channel-cut (hrm1064: theta / tilt / x / y plus piezo fine theta / tilt); a second isotope / resolution branch (NRS-1)"
    - name: HighResMono3D
      family: Monochromator
      pv: {theta: "p01/motor/eh1.47", tilt: "p01/motor/eh1.46", x: "p01/motor/eh1.42", y: "p01/motor/eh1.48"}
      new: true
      confirm: true
      note: "high-resolution monochromator, 3-bounce 'd' configuration (hrm3d); selectable nested HRM branch (NRS-1)"
    - name: HighResMono3W
      family: Monochromator
      pv: {theta: "p01/motor/eh1.44", tilt: "p01/motor/eh1.43", x: "p01/motor/eh1.41", y: "p01/motor/eh1.45"}
      new: true
      confirm: true
      note: "high-resolution monochromator, 3-bounce 'w' configuration (hrm3w); selectable nested HRM branch (NRS-1)"
    - name: HighResMonoEnergy
      family: PseudoAxis
      pv: {hrm_ener: "p01/vmexecutor/hrm_ener", hrm_ener2: "p01/vmexecutor/hrm_ener2"}
      new: true
      confirm: true
      note: "virtual energy axes coupling the HRM theta motions (hrm_ener / hrm_ener2 on vmexecutor); the scanned coordinate for the NRS energy spectrum (NRS-1)"
    - name: CompoundRefractiveLens
      family: Transfocator
      pv: {rotation: "p01/motor/eh1.17", theta: "p01/motor/eh1.18", x: "p01/motor/eh1.19", y: "p01/motor/eh1.20"}
      new: true
      confirm: true
      note: "compound refractive lens focusing assembly (crl2: rot / th / x / y); lens count / material and whether it is a transfocator stack are OPT-1"
    - name: BeamDefiningSlit
      family: Slit
      pv: {bottom: "p01/motor/eh1.05", top: "p01/motor/eh1.06", left: "p01/motor/eh1.07", right: "p01/motor/eh1.08", center_x: "p01/vmexecutor/jjslit_eh1_cx", center_y: "p01/vmexecutor/jjslit_eh1_cy", gap_x: "p01/vmexecutor/jjslit_eh1_dx", gap_y: "p01/vmexecutor/jjslit_eh1_dy"}
      new: true
      confirm: true
      note: "EH1 beam-defining JJ slit (slit2: four blades + cx/cy/dx/dy virtual motors)"
    - name: BeamPositionMonitor
      family: FluxMonitor
      pv: {x: "p01/motor/eh1.21", y: "p01/motor/eh1.22"}
      new: true
      confirm: true
      note: "EH1 beam-position monitor stage (bpm2); a positioning stage for a BPM insert, role is a candidate FluxMonitor (DET-1)"
    - name: IonChamber
      family: FluxMonitor
      pv: {x: "p01/motor/eh1.23", y: "p01/motor/eh1.24"}
      new: true
      confirm: true
      note: "EH1 ion-chamber positioning stage (ic2); flux normalization monitor (DET-1)"
    - name: SampleTable
      family: Table
      pv: {x: "p01/motor/eh1.31", y: "p01/motor/eh1.32"}
      new: true
      confirm: true
      note: "EH1 sample / instrument table (tab1)"

# ===========================================================================
