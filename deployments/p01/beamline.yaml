      family: Goniometer           # catalog Family; the sample-orientation circle, would compose a Diffractometer Assembly if a detector arm is confirmed (DIFF-1)
      pv: {theta: "p01/motor/eh2.49", two_theta: "p01/motor/eh2.37"}
      new: true
      confirm: true
      note: "EH2 sample-orientation goniometer (diff_th / diff_tth); the registry exposes theta and two-theta only. Modeled as a Goniometer Asset, not the composed Diffractometer Assembly, until the full circle count and a detector arm are confirmed (DIFF-1)"
    - name: SampleStage
      family: LinearStage
      pv: {x: "p01/motor/eh2.34", y: "p01/motor/eh2.33", tilt: "p01/motor/eh2.35"}
      new: true
      confirm: true
      note: "EH2 sample positioning / centring stage (sam: x / y / tilt)"
    - name: DefiningSlit
      family: Slit
      pv: {bottom: "p01/motor/eh2.01", top: "p01/motor/eh2.02", left: "p01/motor/eh2.03", right: "p01/motor/eh2.04", center_x: "p01/vmexecutor/jjslit_eh2_cx", center_y: "p01/vmexecutor/jjslit_eh2_cy", gap_x: "p01/vmexecutor/jjslit_eh2_dx", gap_y: "p01/vmexecutor/jjslit_eh2_dy"}
      new: true
      confirm: true
      note: "EH2 beam-defining JJ slit (slit3)"
    - name: DetectorSlit
