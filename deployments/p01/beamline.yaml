      pv: {x: "p01/vmexecutor/eh3_tab2_x", x1: "p01/motor/eh3.37", x2: "p01/motor/eh3.38", y: "p01/vmexecutor/eh3_tab2_y", y1: "p01/motor/eh3.34", y2: "p01/motor/eh3.35", y3: "p01/motor/eh3.36"}
      new: true
      confirm: true
      note: "EH3 instrument / spectrometer table (tab4: virtual x / y over x1/x2 and y1/y2/y3 jacks)"

eh3-detector:
  stage: detection
  enclosure: p01-eh3
  intro: "The EH3 detector positioning stages: the main RIXS detector carriage and a secondary detector arm. The detector devices themselves are not motor rows (DET-1)."
  note: "Handles read from p01/motor/eh3.* (det / det16). The operative RIXS detector model is DET-1."
