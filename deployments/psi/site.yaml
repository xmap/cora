# CORA Site descriptor: the PSI site-level surface
#
# The Paul Scherrer Institut (PSI, Villigen, Switzerland) is the eighth Site CORA
# models, and its second X-ray free-electron laser after SLAC. PSI hosts two photon
# sources: the Swiss Light Source (SLS) storage ring and SwissFEL. This Site, like
# SLAC (the lab hosting LCLS), is the institute; SwissFEL is a source within it and
# Alvra is one of its experimental stations. This file is the single human-readable
# source for the facility's site-level instances: the Facility itself, the Practices
# it would run, and the facility principals.
#
# Status: reverse-engineered, an off-roadmap modelling exercise (not a CORA pilot).
# CORA has not been connected to PSI and no staff have confirmed this model. Every
# value below is read from PSI's public open-source controls library
# (paulscherrerinstitute/eco, the SwissFEL device library) or inferred, and is
# carried as `pending` until staff confirm it. Do not invent facility specifics
# here; carry them as questions on the Alvra open-questions page.
#
# Source-of-truth boundary (same as the APS / MAX IV / Diamond / NSLS-II / SLAC / AS sites):
#   - the closed facility-kind / actor-kind vocabularies are validated against
#     code-mirrored frozensets in scripts/site_descriptor.py.
#   - the facility records the bootstrap invariants (kind=Site, display_name equals
#     code); `heading` carries the human title used on the rendered page.
#   - a non-pending practice method must resolve to a catalog Method; PSI / SwissFEL
#     runs none of the catalog's tomography methods, so each practice is carried
#     pending until its Method is earned.
#
# Why PSI / Alvra (what it tests): Alvra is CORA's SECOND XFEL, after SLAC LCLS-MFX.
# Its value is reinforcement from an INDEPENDENT control stack: LCLS-MFX was mined
# from `pcdshub`, Alvra from `eco`. If the same family-fold finding and the same
# architectural gaps (per-shot pulse-ID DAQ, beam-synchronous timing, fs pump-probe
# synchronization, one switched source feeding co-equal stations) recur at a second
# XFEL built by a different team, that is strong evidence the model generalizes
# beyond one facility's house style, not just beyond storage rings.

facility:
  code: psi
  display_name: psi
  heading: "PSI"
  kind: Site
  institution: Paul Scherrer Institut (PSI), Switzerland
  beamlines: [Alvra, Bernina]

# ISA-88 Site Recipes: the facility-adapted form of a catalog Method. None of CORA's
# catalog Methods (all tomography-family today) fit an XFEL pump-probe station, so
# every Alvra practice is pending, naming the Method it would earn. The pump-probe
# and emission-spectroscopy practices reuse the same pending Methods SLAC LCLS-MFX
# introduced; none is yet in the catalog. Confirm with PSI staff.
practices:
  - {name: Alvra_pump_probe_practice, method: pump_probe, pending: true, note: "femtosecond optical-laser pump / X-ray probe; needs laser-to-X-ray timing. Reuses the LCLS-MFX pump_probe Method, not yet in the catalog (TECH-1, LASER-1)"}
  - {name: Alvra_spectroscopy_practice, method: xas_spectroscopy, pending: true, note: "time-resolved XAS / XES (transient absorption and emission) via the DCM and the von Hamos emission spectrometer. Reuses the LCLS-MFX spectroscopy Method (TECH-1)"}
  - {name: Alvra_serial_crystallography_practice, method: serial_crystallography, pending: true, note: "time-resolved serial femtosecond crystallography on the Prime endstation; reuses the LCLS-MFX Method (TECH-1, SAMPLE-1)"}
  - {name: Bernina_pump_probe_practice, method: pump_probe, pending: true, note: "femtosecond optical-laser pump / X-ray probe on the diffraction endstation; shares the Alvra / LCLS-MFX pump_probe Method (TECH-1, LASER-1)"}
  - {name: Bernina_time_resolved_diffraction_practice, method: diffraction, pending: true, note: "time-resolved hard X-ray diffraction / scattering on the GPS six-circle and XRD kappa diffractometers; a new pending Method, no catalog tomography Method fits an XFEL diffraction platform (TECH-1, DIFF-1)"}

# Access BC Actors conceptually facility-wide at PSI. Pending until the SwissFEL
# operator and review structure is confirmed; the device library exposes no human roster.
actors:
  - {name: PSI beamline staff, kind: human, pending: true, note: "SwissFEL instrument-scientist and operator pool; structure TBD (GOV-1)"}
  - {name: PSI safety review, kind: human, pending: true, note: "facility safety review body; membership TBD"}

# Agent BC Agents seeded at this deployment. None declared: the CORA system agents
# are not wired for a PSI deployment, and Alvra is a modelling exercise.
agents: []

# Supply BC: facility-wide continuously-available resources. Pending in design. The
# FEL beam is carried as a PhotonBeam supply (as at SLAC); its per-shot, pulse-ID-
# tagged nature is an acquisition concern, recorded on the Alvra open questions
# (DAQ-1), not a supply attribute. The Aramis source is shared across the Alvra,
# Bernina, and Cristallina stations one at a time (TOPO-1).
supplies:
  - {name: SwissFEL photon beam, kind: PhotonBeam, pending: true, note: "SwissFEL Aramis free-electron-laser beam, shared across the Aramis stations (TOPO-1)"}
  - {name: Cooling water, kind: CoolingWater, pending: true}
  - {name: Beamline vacuum, kind: Vacuum, pending: true}

# Safety BC: facility-issued Clearances. PSI personnel safety and the pump-probe
# optical-laser safety are both carried pending; the SwissFEL PSS form names are not
# in the device library, and the pump-probe laser is modelled as a Clearance hazard,
# not an Asset CORA drives (the LCLS-MFX / 32-ID precedent, LASER-1).
clearances:
  - {name: PSI personnel safety system, kind: PSS, pending: true, note: "SwissFEL safety-form and permit-leaf names TBD; confirm with staff (PSS-1)"}
  - {name: Alvra pump-probe laser clearance, kind: Clearance, pending: true, note: "class-4 optical pump-probe laser; modelled as a hazard on the experiment, not a driven Asset (LASER-1)"}
  - {name: Bernina pump-probe laser clearance, kind: Clearance, pending: true, note: "class-4 optical pump-probe laser on the diffraction endstation; modelled as a hazard, not a driven Asset (LASER-1)"}

# Caution BC: operator tribal knowledge. None yet for a modelling exercise.
cautions: []
